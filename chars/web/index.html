<!doctype html>
<meta charset="utf-8">
<title>이렘 — 몸과 옷 보기</title>
<style>
  :root { color-scheme: dark; --bg:#12100e; --pan:#1b1815; --line:#302a25; --tx:#ddd5cb; --dim:#8a7f74; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; background:var(--bg); color:var(--tx);
         font:13px/1.5 "Noto Sans CJK KR","Noto Sans KR",system-ui,sans-serif; }
  #side { width:250px; flex:none; overflow-y:auto; padding:14px; background:var(--pan);
          border-right:1px solid var(--line); }
  #view { flex:1; position:relative; min-width:0; }
  canvas { display:block; }
  h2 { margin:0 0 12px; font-size:14px; letter-spacing:.05em; }
  h3 { margin:18px 0 6px; font-size:11px; color:var(--dim); font-weight:600; letter-spacing:.12em; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
  button { font:inherit; padding:5px 6px; border:1px solid var(--line); border-radius:4px;
           background:#23201c; color:var(--tx); cursor:pointer; text-align:left; }
  button:hover { border-color:#5a4f45; }
  button.on { background:#c9a227; border-color:#c9a227; color:#1a1613; font-weight:600; }
  label { display:flex; align-items:center; gap:7px; padding:3px 0; cursor:pointer; }
  input[type=range] { width:100%; }
  #info { position:absolute; left:14px; bottom:12px; color:var(--dim); font-size:12px;
          text-shadow:0 1px 3px #000; pointer-events:none; }
  #err { position:absolute; inset:auto 0 0 0; padding:10px 14px; background:#5a1f1f; display:none; }
</style>

<div id="side">
  <h2>이렘 · 몸과 옷</h2>

  <button id="all" style="width:100%;text-align:center;margin-bottom:4px">55벌 한눈에</button>

  <h3>체형 (역할)</h3>
  <div class="grid" id="bodies"></div>

  <h3>의복 (계층)</h3>
  <div class="grid" id="classes"></div>

  <h3>보기</h3>
  <label><input type="checkbox" id="showBody" checked> 몸 보이기</label>
  <label><input type="checkbox" id="showGarment" checked> 옷 보이기</label>
  <label><input type="checkbox" id="showBones"> 뼈 보이기</label>
  <label><input type="checkbox" id="silhouette" checked> 실루엣으로</label>
  <label><input type="checkbox" id="fade" checked> 발끝 흐려짐</label>
  <label><input type="checkbox" id="spin"> 돌리기</label>

  <h3>강조색</h3>
  <input type="color" id="accent" value="#c9a227" style="width:100%;height:28px;border:0;background:none">

  <h3>바닥에서 지우는 높이</h3>
  <input type="range" id="fadeH" min="0" max="0.5" step="0.01" value="0.22">

  <h3>키 재기</h3>
  <div id="meas" style="color:var(--dim);font-size:12px"></div>
</div>

<div id="view"><div id="info">끌어서 돌리기 · 휠로 확대 · 우클릭 끌기로 이동 · 격자에서는 돌리기 없음</div><div id="err"></div></div>

<script type="importmap">
{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/" } }
</script>
<script type="module" src="./viewer.js"></script>
