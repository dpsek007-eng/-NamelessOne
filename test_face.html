<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>얼굴 데칼 테스트</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #222; color: #fff; }
    #stage { width: 100%; height: 100vh; display: block; }
    #info { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7);
            padding: 20px; border-radius: 8px; max-width: 400px; }
    #clips button { margin: 2px; padding: 4px 10px; cursor: pointer; }
  </style>
  <script type="importmap">
  {"imports":{
   "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
   "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
  </script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="info">
  <h3>얼굴 데칼 테스트 — north_gatekeeper</h3>
  <p id="status">로드 중...</p>
  <p id="detail" style="white-space:pre-line"></p>
  <div id="clips"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const statusEl = document.getElementById('status');
window.addEventListener('error', e => { statusEl.textContent = '에러: ' + e.message; });

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0.5, 1.6, 1.6);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);   // 머리 높이를 본다
// ?still 을 붙이면 회전을 멈추고 정면을 본다 (헤드리스 검증용)
const params = new URLSearchParams(location.search);
controls.autoRotate = !params.has('still') && !params.has('side') && !params.has('face') && !params.has('nose') && !params.has('eye');
controls.autoRotateSpeed = 2;
// 카메라는 모델 로드 후 실제 머리 높이에 맞춘다 (키가 캐릭터마다 다르다)
function frameCamera(sceneRoot) {
  // 스킨 메시의 bbox 는 바인드 좌표라 못 쓴다 — head 뼈의
  // 월드 위치가 머리 높이다.
  sceneRoot.updateMatrixWorld(true);
  let headBone = null;
  sceneRoot.traverse(n => { if (n.isBone && n.name === 'head') headBone = n; });
  const p = new THREE.Vector3(0, 1.6, 0);
  if (headBone) headBone.getWorldPosition(p);
  const headY = p.y + 0.06;   // 뼈 밑동에서 눈높이쯤
  if (params.has('still')) { camera.position.set(0, headY - 0.1, 1.2); controls.target.set(0, headY - 0.25, 0); }
  if (params.has('side')) { camera.position.set(1.0, headY - 0.05, 0.5); controls.target.set(0, headY, 0); }
  if (params.has('face')) { camera.position.set(0, headY, 0.45); controls.target.set(0, headY, 0); }
  // ?nose: 코 클로즈업 (3/4 각도 — 그림 콧구멍이 코 어디에 얹히는지 본다)
  if (params.has('nose')) { camera.position.set(0.16, headY - 0.06, 0.26); controls.target.set(0, headY - 0.05, 0.08); }
  // ?eye: 눈 클로즈업 (3/4 각도 — 그림 눈이 눈두덩에 붙었는지 본다)
  if (params.has('eye')) { camera.position.set(0.17, headY + 0.02, 0.27); controls.target.set(0, headY, 0.06); }
}

const light = new THREE.DirectionalLight(0xffffff, 2.2);
light.position.set(2, 4, 3);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 1.2));

let mixer = null;
const clock = new THREE.Clock();

async function loadModel() {
  try {
    const loader = new GLTFLoader();
    const model = params.get('model') || 'guard_soldier';
    const gltf = await loader.loadAsync(`/chars/out/demo/${model}.glb`);
    // ?body 를 붙이면 데칼 격자를 숨긴다 (아티팩트가 몸인지 데칼인지 분리)
    if (params.has('body')) {
      gltf.scene.traverse(n => {
        if ((n.isMesh || n.isSkinnedMesh) && n.name.startsWith('face_')) n.visible = false;
      });
    }
    scene.add(gltf.scene);
    frameCamera(gltf.scene);

    // 애니메이션 버튼
    if (gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(gltf.scene);
      let current = mixer.clipAction(gltf.animations[0]);
      current.play();
      const box = document.getElementById('clips');
      for (const clip of gltf.animations) {
        const b = document.createElement('button');
        b.textContent = clip.name;
        b.onclick = () => {
          current.stop();
          current = mixer.clipAction(clip);
          current.reset().play();
        };
        box.appendChild(b);
      }
    }

    let meshCount = 0, vertCount = 0;
    gltf.scene.traverse(n => {
      if (n.isMesh || n.isSkinnedMesh) {
        meshCount++;
        vertCount += n.geometry.attributes.position.count;
      }
    });

    statusEl.textContent = '로드됨 ✓';
    document.getElementById('detail').textContent =
      `클립 ${gltf.animations.length}개 · 메시 ${meshCount}개 · 정점 ${vertCount.toLocaleString()}개`;
  } catch (e) {
    statusEl.textContent = '에러: ' + (e.message || e);
    console.error(e);
  }
}

function animate() {
  requestAnimationFrame(animate);
  if (mixer) mixer.update(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

loadModel();
animate();
</script>
</body>
</html>
