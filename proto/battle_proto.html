<title>이렘 시험판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
:root{
 --ground:#E5E7E9;--surface:#EFF1F2;--sunk:#DADDDF;--card:#F4F5F6;
 --ink:#15181B;--body:#333940;--muted:#6B737B;--faint:#98A0A7;
 --line:#C4C9CD;--hair:#D6DADD;
 --slate:#3F566B;--ember:#9C6B2F;--ok:#3E6B52;--bad:#8A3F3F;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --ground:#131619;--surface:#1B1F23;--sunk:#0E1114;--card:#20252A;
 --ink:#E6E8EA;--body:#C2C8CD;--muted:#8B939B;--faint:#69727A;
 --line:#2B3137;--hair:#232930;
 --slate:#8FAAC1;--ember:#C9954F;--ok:#78B294;--bad:#C97A7A;
}}
:root[data-theme="dark"]{
 --ground:#131619;--surface:#1B1F23;--sunk:#0E1114;--card:#20252A;
 --ink:#E6E8EA;--body:#C2C8CD;--muted:#8B939B;--faint:#69727A;
 --line:#2B3137;--hair:#232930;
 --slate:#8FAAC1;--ember:#C9954F;--ok:#78B294;--bad:#C97A7A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--body);
 font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-weight:300;font-size:15px;line-height:1.7;
 -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Nanum Myeongjo",Georgia,serif;color:var(--ink);margin:0}
.mono,.num,.tag,.lab,kbd{font-family:"Nanum Gothic Coding",ui-monospace,monospace}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:1px solid var(--line);
 background:var(--card);color:var(--ink);border-radius:3px;padding:.4rem .8rem;transition:none}
button:hover:not(:disabled){border-color:var(--slate)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.wrap{max-width:72rem;margin:0 auto;padding:0 clamp(.8rem,3vw,2rem)}

header.top{border-bottom:1px solid var(--line);padding:1.6rem 0 1.2rem;margin-bottom:1.4rem}
header.top .eye{font-size:.66rem;letter-spacing:.22em;color:var(--faint);font-family:"Nanum Gothic Coding",monospace}
header.top h1{font-size:1.7rem;font-weight:800;margin-top:.25rem}
header.top p{font-size:.85rem;color:var(--muted);margin:.5rem 0 0;max-width:44rem}

.grid{display:grid;grid-template-columns:15rem 1fr;gap:1.4rem;align-items:start}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:4px;padding:1rem}
.lab{font-size:.64rem;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;margin-bottom:.55rem}

/* 층 목록 */
.fl{display:block;width:100%;text-align:left;margin-bottom:.3rem;padding:.45rem .6rem;
 background:transparent;border:1px solid transparent;border-radius:3px;color:var(--body)}
.fl:hover{background:var(--card)}
.fl.on{background:var(--card);border-color:var(--slate);color:var(--ink)}
.fl b{font-family:"Nanum Gothic Coding",monospace;font-size:.8rem;margin-right:.5rem;color:var(--faint)}
.fl.on b{color:var(--ember)}
.fl i{font-style:normal;font-size:.68rem;color:var(--faint);float:right;margin-top:.15rem}

/* 조건 */
.route{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center;
 padding:.45rem .6rem;border:1px solid var(--hair);border-radius:3px;margin-bottom:.35rem;font-size:.82rem}
.route.met{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.route .rn{color:var(--muted)}
.route.met .rn{color:var(--ink)}
.route .mult{font-family:"Nanum Gothic Coding",monospace;font-size:.78rem;color:var(--faint)}
.route.met .mult{color:var(--ok);font-weight:700}

/* 편성 */
.teams{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:.9rem}
.team{flex:1;min-width:14rem}
.slots{display:flex;gap:.35rem;flex-wrap:wrap}
.slot{width:3.4rem;height:4.6rem;border:1px dashed var(--line);border-radius:3px;
 display:flex;align-items:center;justify-content:center;background:var(--sunk);position:relative;padding:0}
.slot.filled{border-style:solid;background:var(--card)}
.slot img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.slot .x{position:absolute;top:1px;right:2px;font-size:.6rem;color:var(--faint)}

/* 로스터 */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.4rem;
 max-height:22rem;overflow-y:auto;padding-right:.2rem}
.ch{display:grid;grid-template-columns:2.4rem 1fr;gap:.45rem;align-items:center;padding:.3rem;
 border:1px solid var(--hair);border-radius:3px;background:var(--card);text-align:left;font-size:.75rem}
.ch:disabled{opacity:.3}
.ch img{width:2.4rem;height:3.2rem;object-fit:contain;image-rendering:pixelated}
.ch b{display:block;color:var(--ink);font-weight:500;font-size:.78rem;line-height:1.25}
.ch span{color:var(--faint);font-size:.66rem;font-family:"Nanum Gothic Coding",monospace}
.ch .tr{color:var(--ember);font-family:"Nanum Myeongjo",serif;font-size:.68rem;display:block}
.st{color:var(--ember);font-size:.62rem;letter-spacing:.05em}

/* 전투 */
.bar{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:.2rem}
.bar>i{display:block;height:100%;background:var(--slate)}
.bar.foe>i{background:var(--bad)}
.units{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-bottom:.9rem}
.u{font-size:.76rem;margin-bottom:.5rem}
.u.down{opacity:.35}
.u .nm{display:flex;justify-content:space-between;gap:.5rem}
.u .nm b{color:var(--ink);font-weight:500}
.u .nm span{font-family:"Nanum Gothic Coding",monospace;color:var(--faint);font-size:.68rem}
.log{background:var(--sunk);border-radius:3px;padding:.7rem .85rem;height:15rem;overflow-y:auto;
 font-family:"Nanum Gothic Coding",monospace;font-size:.74rem;line-height:1.85}
.log div{margin-bottom:.1rem}
.log .t{color:var(--faint)}
.log .hit{color:var(--body)}
.log .sk{color:var(--ember)}
.log .heal{color:var(--ok)}
.log .fade{color:var(--bad)}
.res{padding:.9rem 1rem;border-radius:3px;margin-bottom:.9rem;font-size:.9rem}
.res.win{background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid var(--ok);color:var(--ink)}
.res.lose{background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid var(--bad);color:var(--ink)}
.res b{font-family:"Nanum Myeongjo",serif}

/* ── 전투 화면 ── */
.field{position:relative;background:var(--sunk);border:1px solid var(--hair);border-radius:4px;
 height:21rem;margin-bottom:.6rem;overflow:hidden}
.cell{position:absolute;box-sizing:border-box}
.t-plain{background:transparent}
.t-block{background:color-mix(in srgb,var(--ink) 30%,transparent);
 border:1px solid color-mix(in srgb,var(--ink) 42%,transparent)}
.t-rubble{background:color-mix(in srgb,var(--ink) 12%,transparent)}
.t-crack{background:color-mix(in srgb,var(--bad) 22%,transparent)}
.t-drain{background:color-mix(in srgb,var(--slate) 20%,transparent);
 border-top:1px dashed var(--slate);border-bottom:1px dashed var(--slate)}
.t-high{background:color-mix(in srgb,var(--ember) 16%,transparent)}
.t-cover{background:color-mix(in srgb,var(--ok) 22%,transparent);
 border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.t-water{background:color-mix(in srgb,var(--slate) 30%,transparent)}
.t-fire{background:color-mix(in srgb,var(--bad) 34%,transparent)}
.gridline{position:absolute;border-right:1px solid color-mix(in srgb,var(--line) 45%,transparent)}
.goalpost{position:absolute;top:0;bottom:0;width:3px;background:var(--ember);opacity:.65}
.un{position:absolute;width:2.3rem;text-align:center;
 transform:translate(-50%,-58%);z-index:2;
 transition:left .32s ease-out, top .32s ease-out}
.legend{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem;font-size:.66rem;
 font-family:"Nanum Gothic Coding",monospace;color:var(--muted)}
.legend i{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;vertical-align:-1px;margin-right:.25rem}
.un.act{transform:translateY(-10px)}
.un.ally.lunge{transform:translate(-50%,-58%) translateX(9px)}
.un.foe.lunge{transform:translate(-50%,-58%) translateX(-9px)}
.un.act{transform:translate(-50%,-66%)}
.un.ref img,.un.ref .fg{opacity:.75}
.un.ref .un-nm{color:var(--ember)}
.un.gone{opacity:0;transform:translateY(-14px)}
.un.alert .un-nm{color:var(--ember)}
.un.fell{opacity:.22;filter:grayscale(1)}
.un img{width:100%;height:2.2rem;object-fit:contain;image-rendering:pixelated;display:block}
.un .fg{width:1.5rem;height:2.2rem;margin:0 auto;background:var(--bad);opacity:.55;
 border-radius:2px 2px 0 0;clip-path:polygon(50% 0,78% 22%,74% 100%,26% 100%,22% 22%)}
.un .un-nm{font-size:.48rem;color:var(--muted);line-height:1.15;margin-top:.05rem;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un .hb{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:.2rem}
.un .hb>i{display:block;height:100%;background:var(--slate);transition:width .28s ease-out}
.un.foe .hb>i{background:var(--bad)}
.pop{position:absolute;left:50%;top:.2rem;transform:translateX(-50%);
 font-family:"Nanum Gothic Coding",monospace;font-size:.74rem;font-weight:700;
 pointer-events:none;animation:rise .9s ease-out forwards;white-space:nowrap;z-index:3}
.pop.d{color:var(--bad)}.pop.h{color:var(--ok)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,4px)}
 18%{opacity:1}100%{opacity:0;transform:translate(-50%,-22px)}}
.skname{position:absolute;left:50%;top:-.8rem;transform:translateX(-50%);
 font-family:"Nanum Myeongjo",serif;font-size:.6rem;color:var(--ember);
 white-space:nowrap;animation:rise 1.1s ease-out forwards;z-index:3}
.turnbig{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
 font-family:"Nanum Myeongjo",serif;font-size:2.2rem;color:var(--ink);opacity:0;
 animation:flash .7s ease-out forwards;pointer-events:none;z-index:2}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.9)}
 25%{opacity:.5}100%{opacity:0;transform:translate(-50%,-50%) scale(1.06)}}
.goalbar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.6rem;font-size:.8rem}
.goalbar .g{font-family:"Nanum Myeongjo",serif;color:var(--ink);font-size:.92rem}
.goalbar .prog{font-family:"Nanum Gothic Coding",monospace;color:var(--ember);font-weight:700}
.envs{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.6rem}
.env{font-family:"Nanum Gothic Coding",monospace;font-size:.66rem;color:var(--muted);
 border:1px solid var(--line);border-radius:2px;padding:.08rem .4rem}
.env b{color:var(--ink);font-weight:600}
.ctl{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
.ctl .sp{font-family:"Nanum Gothic Coding",monospace;font-size:.7rem;color:var(--faint);margin-left:.3rem}
.ticker{font-family:"Nanum Gothic Coding",monospace;font-size:.76rem;color:var(--muted);
 min-height:1.4rem;margin-bottom:.6rem}
@media(prefers-reduced-motion:reduce){
 .un,.pop,.skname,.turnbig{animation:none!important;transition:none!important}
}
.verdict{font-family:"Nanum Myeongjo",serif;font-size:1.5rem;font-weight:800;line-height:1.2}
.res.lose .verdict{color:var(--bad)}
.res.win .verdict{color:var(--ok)}
.why{background:var(--surface);border:1px solid var(--hair);border-radius:4px;padding:.9rem 1rem;margin-bottom:.9rem}
.why .lab{margin-bottom:.6rem}
.wl{display:grid;grid-template-columns:1.1rem 1fr;gap:.5rem;align-items:start;font-size:.86rem;
 line-height:1.7;padding:.16rem 0}
.wl>span:first-child{font-family:"Nanum Gothic Coding",monospace;font-size:.75rem;padding-top:.15rem}
.wl.no>span:first-child{color:var(--bad)}
.wl.ok>span:first-child{color:var(--ok)}
.wl b{color:var(--ink);font-weight:600}
.tips{border-color:var(--ember)}
.tp{font-size:.88rem;line-height:1.7;padding:.5rem 0;border-top:1px solid var(--hair)}
.tp:first-of-type{border-top:0}
.tp b{font-family:"Nanum Myeongjo",serif;color:var(--ink);font-size:.98rem}
.tp s{color:var(--faint)}
.tp em{font-style:normal;color:var(--ember);font-weight:700;font-family:"Nanum Gothic Coding",monospace}
.need{font-size:.78rem;color:var(--muted);margin-top:.15rem}
.det{margin-bottom:.9rem}
.det summary{cursor:pointer;font-family:"Nanum Gothic Coding",monospace;font-size:.72rem;
 letter-spacing:.12em;color:var(--faint);padding:.4rem 0;list-style:none}
.det summary::-webkit-details-marker{display:none}
.det summary::before{content:"▸ ";color:var(--faint)}
.det[open] summary::before{content:"▾ "}
.det summary:hover{color:var(--ink)}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.8rem}
.warn{font-size:.78rem;color:var(--bad)}
.hint{font-size:.76rem;color:var(--muted);margin-top:.5rem}
.pwline{display:flex;gap:1.4rem;flex-wrap:wrap;font-family:"Nanum Gothic Coding",monospace;font-size:.8rem;margin:.6rem 0}
.pwline b{color:var(--ink)}
.pwline .ok{color:var(--ok)}.pwline .no{color:var(--bad)}
footer{border-top:1px solid var(--line);margin-top:2.5rem;padding:1.4rem 0 3rem;
 color:var(--faint);font-size:.76rem;line-height:1.8}
@media(max-width:820px){.grid{grid-template-columns:1fr}.units{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top"><div class="wrap">
 <div class="eye">이렘의 탑 · 전투 시험판</div>
 <h1>잔상 편성</h1>
 <p>실제 캐릭터 데이터와 층 사양으로 돌아갑니다. 편성을 바꾸면 열쇠 경로가 열리고 요구 전투력이 내려갑니다.<br><b>전투력이 요구치의 80%를 밑돌면 거의 못 이기고, 넘어서면 대체로 이깁니다.</b> 그 사이가 승부입니다.</p>
</div></header>

<main class="wrap">
<div class="grid">
 <div>
  <div class="panel" style="margin-bottom:1rem">
   <div class="lab">층</div>
   <div id="floors"></div>
  </div>
  <div class="panel">
   <div class="lab">보유 잔상</div>
   <div class="roster" id="roster"></div>
  </div>
 </div>
 <div>
  <div class="panel" id="main"></div>
 </div>
</div>
</main>
<footer><div class="wrap">
 <p>그림은 부품 조합으로 만든 임시 실루엣입니다. 전투 수치·스킬·층 조건은 실제 설계 데이터입니다.</p>
</div></footer>

<script>
const D = JSON.parse(document.getElementById('DATA').textContent);
const CH = Object.fromEntries(D.chars.map(c => [c.id, c]));
let cur = D.floors.find(f => f.n === 24) || D.floors[0];
let teams = [];
let battle = null;

const el = id => document.getElementById(id);
const flat = () => teams.flat().filter(Boolean);
const owned = () => D.chars;   // 시험판은 실험대다. 22명 전원을 아무 층에나 쓸 수 있다

function resetTeams(){
  teams = Array.from({length: cur.teams}, () => Array(cur.slot).fill(null));
  battle = null;
}

/* ── 조건 판정 — tools/gen_floors.py 와 같은 규칙 ── */
function condMet(c, team){
  const m = team.filter(Boolean).map(id => CH[id]);
  if (!m.length) return false;
  if (c.t === '역할') return m.filter(x => x.role === c.v).length >= c.n;
  if (c.t === '생업') return m.filter(x => x.trade === c.v).length >= c.n;
  if (c.t === '시대') return m.filter(x => x.era === c.v).length >= c.n;
  if (c.t === '층범위'){ const [a,b] = c.v.split('~').map(Number);
    return m.filter(x => x.floor >= a && x.floor <= b).length >= c.n; }
  if (c.t === '약체') return m.reduce((a,x)=>a+x.r,0)/m.length <= 3;
  return false;
}
function routeMet(r, team){ return r.cond.every(c => condMet(c, team)); }

/** 팀별로 가장 유리한(배율이 낮은) 열린 경로 */
function bestRoute(team){
  const open = cur.routes.filter(r => routeMet(r, team));
  return open.sort((a,b) => a.pw - b.pw)[0] || cur.routes.find(r => r.id === 'force');
}
const teamPower = t => t.filter(Boolean).reduce((a,id) => a + CH[id].pw, 0);

function condLabel(c){
  if (c.t === '약체') return '평균 선명도 3 이하';
  if (c.t === '층범위') return `${c.v}층 출신`;
  return `${c.t} ${c.v}${c.n > 1 ? ' ×' + c.n : ''}`;
}
const ROUTE_NAME = {force:'돌파', guard:'수호의 길', seek:'탐구의 길', devote:'헌신의 길',
  resist:'저항의 길', flee:'도피의 길', trade:'생업의 길', era:'그 자리에 있던 사람',
  weak:'이름 없는 길', wall:'담의 약점', drain:'배수로', unseen:'묘수'};

/* ── 전투 ── */
/* ── 전장 ──────────────────────────────────────────────
   3줄 × 14칸 격자. 줄마다 다른 길이고 지형이 대가를 매긴다.
   막힌 칸은 돌아가야 하고, 잔해는 두 배로 느리고, 균열은 지나면 깎인다. */
const MAPW = (D.size && D.size.w) || 24, MAPH = (D.size && D.size.h) || 8;
const X_MIN = 0, X_MAX = MAPW - 1;
const KIT = {
  '수호': {rng:1, mv:3, mult:0.85},
  '저항': {rng:1, mv:3, mult:1.85},
  '헌신': {rng:4, mv:2, mult:0.75},
  '탐구': {rng:5, mv:2, mult:1.00},
  '도피': {rng:2, mv:4, mult:1.20},
  '미상': {rng:2, mv:3, mult:1.00},
};
function envOn(id){ return (cur.env||[]).includes(id); }
function cellAt(x,y){
  const m = cur.map;
  if (!m || y<0 || y>=MAPH || x<0 || x>=MAPW) return '#';
  return m[y][x] || '.';
}
function terr(ch){ return (D.terrain && D.terrain[ch]) || D.terrain['.']; }
function passable(x,y){ return !terr(cellAt(x,y)).block; }
function costOf(x,y){ return Math.max(1, terr(cellAt(x,y)).mv || 1); }
function hazardOf(x,y){ return terr(cellAt(x,y)).dmg || 0; }
function onHigh(u){ return cellAt(u.x,u.y) === '^'; }

function rngOf(u){
  const base = u.rngX ?? (KIT[u.role]||KIT['미상']).rng;
  return Math.max(1, base - (envOn('어둠')?1:0) + (onHigh(u)?1:0));
}
function mvOf(u){
  const base = u.mvX ?? (KIT[u.role]||KIT['미상']).mv;
  return Math.max(1, base - (envOn('재')?1:0));
}
const dist = (a,b) => Math.abs(a.x-b.x) + Math.abs(a.y-b.y);
function inRange(a,t){ return dist(a,t) <= rngOf(a); }
function alive(l){ return l.filter(u => u.hp > 0); }

function engageable(u, foes){
  const l = alive(foes);
  if (!envOn('좁음')) return l;
  const sorted = u.foe ? [...l].sort((a,b)=>b.x-a.x) : [...l].sort((a,b)=>a.x-b.x);
  return sorted.slice(0,2);
}

/** 격자 길찾기 — 지형 비용을 셈해 가장 싼 길로 한 걸음 나아간다 */
function pathStep(u, tx, ty){
  const key = (x,y) => y*MAPW + x;
  const start = key(u.x,u.y), goal = key(tx,ty);
  const distMap = new Map([[start,0]]), prev = new Map();
  const q = [[u.x,u.y]];
  while (q.length){
    const [x,y] = q.shift(); const dcur = distMap.get(key(x,y));
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy;
      if (nx<0||nx>=MAPW||ny<0||ny>=MAPH) continue;
      if (!passable(nx,ny)) continue;
      const nd = dcur + costOf(nx,ny);
      if (!distMap.has(key(nx,ny)) || nd < distMap.get(key(nx,ny))){
        distMap.set(key(nx,ny), nd); prev.set(key(nx,ny), key(x,y)); q.push([nx,ny]);
      }
    }
  }
  if (!distMap.has(goal)) return null;
  // 목표에서 거슬러 올라가며 이동력 안에서 갈 수 있는 가장 먼 칸을 고른다
  let cur2 = goal, path = [];
  while (cur2 !== start){ path.push(cur2); const pv = prev.get(cur2); if (pv === undefined) return null; cur2 = pv; }
  path.reverse();
  const budget = mvOf(u);
  let best = null;
  for (const c of path){
    if (distMap.get(c) <= budget) best = c; else break;
  }
  if (best === null) return null;
  return {x: best % MAPW, y: Math.floor(best / MAPW)};
}
function moveTo(u, tx, ty){
  const st = pathStep(u, tx, ty);
  if (!st) return false;
  u.x = st.x; u.y = st.y;
  return true;
}

/* ── 시야 ──────────────────────────────────────────────
   벽은 시선을 막는다. 높은 곳에 서면 넘겨다본다.
   보이지 않는 것은 모른다 — 알기 전에는 대응할 수 없다. */
const SIGHT = {'수호':6,'저항':6,'헌신':7,'탐구':10,'도피':8,'미상':7};
function sightOf(u){
  const base = u.foe ? 6 : (SIGHT[u.role] ?? 7);
  return Math.max(2, base - (envOn('어둠') ? 3 : 0) + (onHigh(u) ? 3 : 0));
}
/** 두 칸 사이에 벽이 있는가 — 브레젠험 */
function hasLOS(a, b){
  if (onHigh(a)) return true;                 // 높은 곳에서는 넘겨다본다
  let x0=a.x, y0=a.y; const x1=b.x, y1=b.y;
  const dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  const sx=x0<x1?1:-1, sy=y0<y1?1:-1;
  let err=dx-dy, guard=0;
  while ((x0!==x1 || y0!==y1) && guard++ < 200){
    const e2=2*err;
    if (e2 > -dy){ err-=dy; x0+=sx; }
    if (e2 <  dx){ err+=dx; y0+=sy; }
    if (x0===x1 && y0===y1) break;
    if (terr(cellAt(x0,y0)).block) return false;
  }
  return true;
}
function canSee(u, t){
  return dist(u,t) <= sightOf(u) && hasLOS(u,t);
}
/** 아는 적만 추린다. 쏘고 나면 들통난다. */
function knownFoes(u, B){
  const side = u.foe ? alive(B.allies) : alive(B.foes);
  const out = [];
  for (const t of side){
    if (canSee(u,t)) { u.known.set(t.uid, B.round); out.push(t); continue; }
    const last = u.known.get(t.uid);
    if (last !== undefined && B.round - last <= 3) out.push(t);   // 놓쳐도 잠깐은 기억한다
  }
  return out;
}
/** 원거리 공격은 위치를 드러낸다 */
function reveal(attacker, B){
  const other = attacker.foe ? alive(B.allies) : alive(B.foes);
  other.forEach(o => { if (!o.known.has(attacker.uid)) B.ev.push({k:'spot', a:o.uid, t:attacker.uid});
                       o.known.set(attacker.uid, B.round); });
}

/* ── 환경 효과 ── */
function envTick(B, round){
  if (envOn('붕괴')){
    const all = alive([...B.allies, ...B.foes]);
    if (all.length){
      const v = all[Math.floor(Math.random()*all.length)];
      const d = Math.round(v.max * 0.045);
      v.hp = Math.max(0, v.hp - d);
      B.ev.push({k:'env', t:v.uid, d, hp:v.hp, s:'낙석'});
      B.log.push({cls:'fade', s:`  · 벽이 무너져 ${v.nm}에게 ${d}`});
      if (v.hp === 0){ B.ev.push({k:'fall', t:v.uid}); v.fellAt = round; }
    }
  }
  // 지형 피해 — 균열 위에 서 있으면 깎인다
  alive([...B.allies, ...B.foes]).forEach(v => {
    const h = hazardOf(v.x, v.y);
    if (h > 0){
      const d = Math.round(v.max * h);
      v.hp = Math.max(0, v.hp - d);
      B.ev.push({k:'env', t:v.uid, d, hp:v.hp, s:terr(cellAt(v.x,v.y)).n});
      if (v.hp === 0){ B.ev.push({k:'fall', t:v.uid}); v.fellAt = round; }
    }
  });
  if (envOn('종') && round % 3 === 0){
    alive(B.allies).forEach(v => {
      const h = Math.round(v.max * 0.06);
      const b = v.hp; v.hp = Math.min(v.max, v.hp + h);
      if (v.hp > b){ v.healed += v.hp - b; B.ev.push({k:'heal', a:v.uid, t:v.uid, d:v.hp-b, hp:v.hp}); }
    });
    B.log.push({cls:'heal', s:'  · 위층에서 종이 울린다'});
  }
}

/* ── 캐릭터 AI ────────────────────────────────────────
   고정 순서가 아니라, 매 턴 선택지에 점수를 매겨 가장 높은 것을 고른다.
   점수는 그 사람의 성향이 흔든다. 같은 상황에서도 카브릴과 미로는 다르게 고른다. */
function decide(u, B){
  const seen  = knownFoes(u, B);
  const mates = u.foe ? alive(B.foes) : alive(B.allies);
  const foes  = seen;
  const wasAlert = u.alert;
  u.alert = seen.length > 0;
  if (u.alert && !wasAlert) B.ev.push({k:'spot', a:u.uid});

  // 수호자는 자기 자리를 지킨다. 누가 보여야 움직인다.
  if (u.foe){
    if (!seen.length){
      const p = u.post || {x:u.x, y:u.y};
      if (u.x !== p.x || u.y !== p.y) return {a:'move', x:p.x, y:p.y, why:'post'};
      return {a:'wait'};                      // 보이는 것이 없으면 그대로 선다
    }
    let pool = engageable(u, seen);
    if (B.goal.t === '대피' && !pool.some(x => inRange(u,x))){
      const r = alive(B.refugees||[]).filter(x => inRange(u,x) && canSee(u,x));
      if (r.length) pool = r;
    }
    const t = pool.filter(f => inRange(u,f)).sort((x,y)=>x.hp-y.hp)[0];
    if (t) return {a:'hit', t};
    const n = pool.sort((x,y)=>dist(u,x)-dist(u,y))[0];
    return n ? {a:'move', x:n.x, y:n.y, why:'close'} : {a:'wait'};
  }

  const W = (u.trait && u.trait.w) || {};
  const w = k => 1 + (W[k] || 0) * 0.55;
  const opts = [];

  // 어느 줄로 갈 것인가 — 지형과 적 분포를 보고 고른다
  function laneScore(y){
    let cost = 0, hazard = 0, enemies = 0;
    for (let x = u.x; x <= X_MAX; x++){
      if (!passable(x,y)) { cost += 6; continue; }
      cost += costOf(x,y) - 1;
      hazard += hazardOf(x,y) * 14;
    }
    foes.forEach(f => { if (f.y === y) enemies++; });
    // 앞뒤가 없는 이는 적이 많은 쪽으로, 물러설 줄 아는 이는 빈 쪽으로
    return -cost - hazard + enemies * (W.attack||0) * 1.4 - enemies * (W.retreat||0) * 1.2;
  }
  const lanes = [0,1,2].filter(y => passable(u.x,y) || y===u.y);
  const pickLane = lanes.sort((p,q) => laneScore(q) - laneScore(p))[0] ?? u.y;
  const pool = engageable(u, seen);
  const inR  = pool.filter(f => inRange(u,f));
  const ratio = u.hp / u.max;
  const goalT = B.goal.t;

  // 친다 — 약한 것부터
  if (inR.length){
    const t = [...inR].sort((x,y)=>x.hp-y.hp)[0];
    opts.push({a:'hit', t, why:'attack', s: (1.0 + (1 - t.hp/t.max)*0.7) * w('attack')});
  }
  // 약점을 본다
  if (inR.length){
    const t = [...inR].sort((x,y)=>y.hp-x.hp)[0];
    opts.push({a:'hit', t, mark:true, why:'mark', s: 0.85 * w('mark')});
  }
  // 살린다
  const hurt = mates.filter(m => m.hp < m.max*0.95).sort((x,y)=>x.hp/x.max - y.hp/y.max)[0];
  if (hurt){
    const need = 1 - hurt.hp/hurt.max;
    if (dist(u,hurt) <= rngOf(u)) opts.push({a:'heal', t:hurt, why:'heal', s:(0.5 + need*1.8) * w('heal')});
    else opts.push({a:'move', x:hurt.x, y:hurt.y, why:'heal', s:(0.3 + need*0.9) * w('heal')});
  }
  // 앞을 막는다
  if (foes.length){
    const front = Math.max(...mates.map(m => m.x));
    const fm = mates.reduce((p,q)=>q.x>p.x?q:p, mates[0]);
    if (u.x < front) opts.push({a:'move', x:Math.min(X_MAX, front+1), y:fm.y, why:'guard', s: 0.75 * w('guard')});
    else opts.push({a:'move', x:Math.min(X_MAX, u.x+1), y:pickLane, why:'guard', s: 0.55 * w('guard')});
  }
  // 나아간다 — 목표가 앞에 있을 때
  if (goalT === '도달' || goalT === '타종' || goalT === '대피'){
    opts.push({a:'move', x:X_MAX, y:pickLane, why:'advance', s: 1.25 * w('advance')});
  }
  // 종을 친다
  if (goalT === '타종' && u.x >= X_MAX - 1) opts.push({a:'ring', why:'ring', s: 3.2 * w('ring')});
  // 물러선다
  if (ratio < 0.6) opts.push({a:'move', x:Math.max(0,u.x - mvOf(u)), y:pickLane, why:'retreat', s: (1-ratio)*1.7 * w('retreat')});
  // 거리를 둔다
  if (rngOf(u) >= 3 && foes.some(f => dist(u,f) <= 1))
    opts.push({a:'move', x:Math.max(0,u.x - mvOf(u)), y:pickLane, why:'keepdist', s: 0.95 * w('keepdist')});
  // 다가간다
  if (!inR.length && pool.length){
    const n = [...pool].sort((x,y)=>dist(u,x)-dist(u,y))[0];
    opts.push({a:'move', x:n.x, y:n.y, why:'close', s: 0.8});
  }

  if (!seen.length){
    // 아직 아무것도 못 봤다. 목표 행동이 있으면 그것부터, 없으면 나아간다.
    const obj = opts.find(o => o.a === 'ring' || o.a === 'heal');
    if (obj) return obj;
    return {a:'move', x:X_MAX, y:pickLane, why:'advance'};
  }
  if (!opts.length) return {a:'wait'};
  opts.sort((x,y) => y.s - x.s);
  return opts[0];
}


/* 수호자는 층의 절대 요구치에서 만든다. 열쇠를 열면 요구치가 내려가 상대가 약해진다. */
const START_X = {'수호':2,'저항':2,'도피':2,'헌신':1,'탐구':0,'미상':1};
const START_Y = {'수호':3,'저항':2,'도피':5,'헌신':4,'탐구':4,'미상':3};
function freeCell(x, y, taken){
  for (let r=0; r<MAPH*MAPW; r++){
    const yy=(y+r)%MAPH, xx=Math.min(X_MAX, x + Math.floor(r/MAPH));
    if (passable(xx,yy) && !taken.has(yy*MAPW+xx)){ taken.add(yy*MAPW+xx); return {x:xx,y:yy}; }
  }
  return {x, y};
}
function mkRefugees(n){
  const out=[];
  for(let i=0;i<n;i++) out.push({nm:`피난민 ${i+1}`, ref:true, uid:'r'+i,
    hp:300, max:300, atk:0, def:40, spd:60, role:'미상', x:0, y:(2+i*2)%MAPH, out:false, dbuf:0,
    dealt:0, taken:0, healed:0, fellAt:0});
  return out;
}
const FOE_KINDS = [
  {nm:'재',    rng:1, mv:4, hp:1.15, atk:1.00, spd:88},   // 근접. 두껍고 느리다
  {nm:'잔해',  rng:4, mv:2, hp:0.70, atk:1.25, spd:96},   // 원거리. 얇지만 아프다
  {nm:'그림자',rng:2, mv:6, hp:0.80, atk:0.95, spd:118},  // 빠르게 파고든다
];
function mkFoes(req, n){
  // 수호자 수를 아군 수에 맞춘다. 1:5 면 행동 횟수가 5배라 어떤 수치를 줘도 승부가 안 된다.
  // 전멸이 목표가 아닌 층은 버티고 통과하는 싸움이므로 화력을 낮춘다.
  const soft = (['도달','타종'].includes((cur.goal||{}).t) ? 0.52
              : (cur.goal && cur.goal.t !== '전멸') ? 0.86 : 1)
             * (cur.teams >= 3 ? 0.68 : 1);   // 관문은 15명을 채우느라 평균 전력이 떨어진다
  const out = [];
  const NAMES = ['재','잔해','그림자','메아리','잔불'];
  for (let i = 0; i < n; i++){
    const K = FOE_KINDS[i % FOE_KINDS.length];
    out.push({ nm:`${cur.n}층의 ${K.nm}`, foe:true, kind:K.nm,
      hp: Math.round(req*2.7/n*K.hp), max: Math.round(req*2.7/n*K.hp),
      atk: Math.round(req*0.31/n*soft*K.atk), def: Math.round(req*0.022/Math.sqrt(n)),
      spd: K.spd + i, role:'저항', dbuf:0, uid:'f'+i, dealt:0, taken:0, healed:0, fellAt:0,
      rngX: K.rng, mvX: K.mv, known: new Map(), post: null, alert: false,
      x: Math.max(0, X_MAX - 1 - (i%3)), y: (1 + i*2) % MAPH });
  }
  return out;
}
function mkAlly(id){
  const c = CH[id];
  return { nm:c.name, id, hp:c.hp, max:c.hp, atk:c.atk, def:c.def, spd:c.spd,
           role:c.role, sk:c.skills, col:c.col, sp:c.sp, dbuf:0,
           dealt:0, taken:0, healed:0, fellAt:0, uid:'a'+id,
           x: START_X[c.role] ?? 1, y: START_Y[c.role] ?? 1, trait: c.trait || {},
           known: new Map(), post: null, alert: false };
}
function startBattle(){
  const t0 = teams.map(t => t.filter(Boolean));
  if (t0.some(t => t.length === 0)){ battle = null; return; }
  const rt = t0.map(bestRoute);
  // 층의 절대 요구치를 쓴다. 팀 전투력에 비례시키면 편성 차이가 상쇄되어 사라진다.
  const req = t0.map((t,i) => Math.round(cur.base / cur.teams * rt[i].pw));
  const allies = t0.flat().map(mkAlly);
  { const taken = new Set();
    allies.forEach(u => { const c = freeCell(u.x, u.y, taken); u.x=c.x; u.y=c.y; }); }
  const foes = mkFoes(req.reduce((a,b)=>a+b,0), Math.max(2, allies.length));
  { const taken = new Set();
    foes.forEach(u => { const c = freeCell(u.x, u.y, taken); u.x=c.x; u.y=c.y; u.post={x:c.x,y:c.y}; }); }
  const goal = cur.goal || {t:'전멸', name:'수호자를 전부 흐리게 한다'};
  const refugees = goal.t === '대피' ? mkRefugees(goal.n) : [];
  battle = { allies, foes, refugees, log: [], ev: [], round: 0, done: false, win: false,
             routes: rt, req, goal, rings: 0, escaped: 0, reason: '' };
  run();
  play();          // 계산은 끝났고, 이제 시간에 맞춰 재생한다
  render();
  startPlay();
}
function pick(list){ const a = list.filter(u => u.hp > 0); return a[Math.floor(Math.random()*a.length)]; }
function coverOf(u){ return (terr(cellAt(u.x,u.y)).def) || 0; }
function dmg(a, t, mult){
  const v = 0.85 + Math.random()*0.30;                       // ±15% 변동
  const crit = Math.random() < 0.12 ? 1.6 : 1;               // 12% 급소
  const d = Math.max(1, Math.round(
      ((a.atk*mult*v*crit) - t.def*(1 - t.dbuf)*0.6) * (1 - coverOf(t))));
  t.hp = Math.max(0, t.hp - d);
  if (a.dealt !== undefined) a.dealt += d;
  if (t.taken !== undefined) t.taken += d;
  if (t.hp === 0 && t.fellAt === 0) t.fellAt = battle ? battle.round : 0;
  if (battle) battle.ev.push({k:'hit', a:a.uid, t:t.uid, d, hp:t.hp});
  return d;
}
function checkGoal(B, round){
  const G = B.goal;
  if (alive(B.allies).length === 0){ B.done=true; B.win=false; B.reason='아군이 전부 흐려졌다'; return; }
  if (G.t === '전멸' && alive(B.foes).length === 0){ B.done=true; B.win=true; B.reason='수호자를 전부 흐리게 했다'; }
  else if (G.t === '생존' && round >= G.n){ B.done=true; B.win=true; B.reason=`${G.n}턴을 버텼다`; }
  else if (G.t === '대피' && B.escaped >= G.n){ B.done=true; B.win=true; B.reason=`${G.n}명을 내보냈다`; }
  else if (G.t === '도달' && alive(B.allies).some(u => u.x >= X_MAX)){ B.done=true; B.win=true; B.reason='반대편에 닿았다'; }
  else if (G.t === '타종' && B.rings >= G.n){ B.done=true; B.win=true; B.reason=`종을 ${G.n}번 쳤다`; }
  if (G.t === '대피' && alive(B.refugees).length === 0 && B.escaped < G.n){
    B.done=true; B.win=false; B.reason='피난민이 남지 않았다'; }
}
function run(){
  const B = battle, L = (cls, s) => B.log.push({cls, s});
  L('t', `── ${cur.n}층 ${cur.name} ──`);
  (cur.envInfo||[]).forEach(e => L('sk', `환경 · ${e.name} — ${e.desc}`));
  L('sk', `목표 · ${B.goal.name}`);
  B.routes.forEach((r,i) => L('sk',
    `${B.routes.length>1?(i+1)+'팀 ':''}${ROUTE_NAME[r.id]||r.id} · 요구 ${Math.round(r.pw*100)}%`));

  for (let round = 1; round <= 40 && !B.done; round++){
    B.round = round; L('t', `[${round}턴]`); B.ev.push({k:'turn', n:round});
    envTick(B, round);

    // 피난민은 스스로 오른쪽으로 간다
    if (B.goal.t === '대피'){
      alive(B.refugees).forEach(r => {
        moveTo(r, X_MAX, r.y);
        B.ev.push({k:'move', t:r.uid, x:r.x, y:r.y});
        if (r.x >= X_MAX && !r.out){ r.out = true; r.hp = 0; B.escaped++;
          L('heal', `  ${r.nm} 빠져나갔다 (${B.escaped}/${B.goal.n})`);
          B.ev.push({k:'escape', t:r.uid}); }
      });
    }

    const order = [...alive(B.allies), ...alive(B.foes)].sort((a,b) => b.spd - a.spd);
    for (const u of order){
      if (u.hp <= 0 || B.done) continue;
      const d = decide(u, B);
      const WHY = {advance:'앞으로', retreat:'물러선다', guard:'막아선다',
                   keepdist:'거리를 둔다', heal:'다가간다', close:'붙는다',
                   post:'자리로 돌아간다'};
      if (d.a === 'move'){
        const fx = u.x, fy = u.y;
        moveTo(u, Math.max(0,Math.min(X_MAX,d.x)), d.y ?? u.y);
        if (u.x !== fx || u.y !== fy){
          B.ev.push({k:'move', t:u.uid, x:u.x, y:u.y, why:WHY[d.why]||''});
          L('t', `  ${u.nm} — ${WHY[d.why]||'이동'}`); }
      } else if (d.a === 'ring'){
        B.rings++; B.ev.push({k:'ring', a:u.uid, n:B.rings});
        L('heal', `  ${u.nm} 종을 쳤다 (${B.rings}/${B.goal.n})`);
      } else if (d.a === 'heal'){
        const h = Math.round(u.atk * 1.7), before = d.t.hp;
        d.t.hp = Math.min(d.t.max, d.t.hp + h); u.healed += d.t.hp - before;
        B.ev.push({k:'act', a:u.uid, sk:(u.sk&&u.sk[0]?u.sk[0].n:'회복')});
        B.ev.push({k:'heal', a:u.uid, t:d.t.uid, d:d.t.hp-before, hp:d.t.hp});
        L('heal', `  ${u.nm} → ${d.t.nm} +${d.t.hp-before}`);
      } else if (d.a === 'hit'){
        const sk = u.sk && u.sk[0] ? u.sk[0].n : '공격';
        B.ev.push({k:'act', a:u.uid, sk, trait:(u.trait&&u.trait.name)||''});
        if (d.mark) d.t.dbuf = 0.35;
        const dd = dmg(u, d.t, (KIT[u.role]||KIT['미상']).mult);
        if (dist(u, d.t) > 1) reveal(u, B);        // 멀리서 쏘면 위치가 드러난다
        L('hit', `  ${u.nm} 「${sk}」 → ${d.t.nm} ${dd}`);
        if (d.t.hp === 0){ d.t.fellAt = round; B.ev.push({k:'fall', t:d.t.uid});
          L('fade', `  ${d.t.nm} 흐려졌다`); }
      }
      checkGoal(B, round);
    }
    if (!B.done) checkGoal(B, round);
  }
  if (!B.done){ B.done = true; B.win = false; B.reason = '40턴을 넘겼다'; L('t','── 40턴 초과 ──'); }
  L(B.win ? 'heal' : 'fade', `── ${B.reason} ──`);
}

/* ── 재생 ── */
let timer = null;
function play(){
  const B = battle;
  B.pb = { i:0, done:false, speed:1 };
  B.disp = {};
  [...B.allies, ...B.foes, ...(B.refugees||[])].forEach(u =>
    B.disp[u.uid] = {hp:u.max, max:u.max, fell:false, x:u.x, y:u.y});
}
function unitByUid(uid){ return [...battle.allies, ...battle.foes, ...(battle.refugees||[])].find(u => u.uid === uid); }
function stepEvent(){
  const B = battle;
  if (!B.pb || B.pb.i >= B.ev.length){ finishPlay(); return; }
  const e = B.ev[B.pb.i++];
  const fld = document.getElementById('field');
  if (!fld) return;
  const dom = uid => fld.querySelector(`[data-u="${uid}"]`);
  if (e.k === 'turn'){
    el('ticker').textContent = `${e.n}턴`;
    const t = document.createElement('div'); t.className='turnbig'; t.textContent = e.n;
    fld.appendChild(t); setTimeout(()=>t.remove(), 700);
  } else if (e.k === 'act'){
    const au = unitByUid(e.a);
    if (au) el('ticker').innerHTML =
      `<b style="color:var(--ink)">${au.nm}</b>` +
      (e.trait ? ` <span style="color:var(--ember)">「${e.trait}」</span>` : '') +
      ` — ${e.sk}`;
    const d = dom(e.a); if (d){ d.classList.add('act');
      const n = document.createElement('div'); n.className='skname'; n.textContent = `「${e.sk}」`;
      d.appendChild(n); setTimeout(()=>{ d.classList.remove('act'); n.remove(); }, 900); }
  } else if (e.k === 'hit' || e.k === 'heal'){
    const A = dom(e.a), T = dom(e.t);
    if (A){ A.classList.add('lunge'); setTimeout(()=>A.classList.remove('lunge'), 170); }
    B.disp[e.t].hp = e.hp;
    if (T){
      const bar = T.querySelector('.hb>i'); if (bar) bar.style.width = (e.hp/B.disp[e.t].max*100)+'%';
      const pop = document.createElement('div');
      pop.className = 'pop ' + (e.k==='hit' ? 'd' : 'h');
      pop.textContent = (e.k==='hit' ? '-' : '+') + e.d;
      T.appendChild(pop); setTimeout(()=>pop.remove(), 900);
    }
  } else if (e.k === 'spot'){
    const su = unitByUid(e.a), tu = e.t ? unitByUid(e.t) : null;
    const S = dom(e.a);
    if (S){ const n=document.createElement('div'); n.className='skname'; n.textContent='!';
      S.appendChild(n); setTimeout(()=>n.remove(), 900); S.classList.add('alert'); }
    if (su) el('ticker').innerHTML =
      `<b style="color:var(--ink)">${su.nm}</b> — ${tu ? tu.nm+'를 발견했다' : '무언가를 알아차렸다'}`;
  } else if (e.k === 'move'){
    B.disp[e.t].x = e.x; if (e.y !== undefined) B.disp[e.t].y = e.y;
    const T = dom(e.t);
    if (T){ T.style.left = cx(e.x) + '%'; if (e.y !== undefined) T.style.top = cy(e.y) + '%'; }
    const mu = unitByUid(e.t);
    if (mu && e.why) el('ticker').innerHTML =
      `<b style="color:var(--ink)">${mu.nm}</b> — ${e.why}` +
      (mu.trait && mu.trait.line ? ` <span style="color:var(--faint)">「${mu.trait.line}」</span>` : '');
  } else if (e.k === 'ring'){
    B.rings = e.n;
    const A = dom(e.a);
    if (A){ const n=document.createElement('div'); n.className='skname'; n.textContent='종';
      A.appendChild(n); setTimeout(()=>n.remove(), 1100); }
    el('ticker').textContent = `종을 쳤다 ${e.n}/${B.goal.n}`;
  } else if (e.k === 'escape'){
    B.escaped++; B.disp[e.t].fell = true;
    const T = dom(e.t); if (T) T.classList.add('gone');
    el('ticker').textContent = `빠져나갔다 ${B.escaped}/${B.goal.n}`;
  } else if (e.k === 'env'){
    B.disp[e.t].hp = e.hp;
    const T = dom(e.t);
    if (T){ const bar=T.querySelector('.hb>i'); if(bar) bar.style.width=(e.hp/B.disp[e.t].max*100)+'%';
      const pop=document.createElement('div'); pop.className='pop d'; pop.textContent=`${e.s} -${e.d}`;
      T.appendChild(pop); setTimeout(()=>pop.remove(), 900); }
  } else if (e.k === 'fall'){
    B.disp[e.t].fell = true;
    const T = dom(e.t); if (T){ T.classList.add('fell');
      const u = unitByUid(e.t);
      el('ticker').textContent = `${u ? u.nm : ''} 흐려졌다`; }
  }
}
function finishPlay(){
  if (timer){ clearInterval(timer); timer = null; }
  if (battle && battle.pb) battle.pb.done = true;
  renderMain();
}
function startPlay(){
  if (timer) clearInterval(timer);
  const gap = 520 / (battle.pb.speed || 1);
  timer = setInterval(stepEvent, gap);
}
function skipPlay(){
  if (timer){ clearInterval(timer); timer = null; }
  while (battle.pb.i < battle.ev.length){
    const e = battle.ev[battle.pb.i++];
    if (e.k==='hit'||e.k==='heal'||e.k==='env') battle.disp[e.t].hp = e.hp;
    if (e.k==='move'){ battle.disp[e.t].x = e.x; if (e.y!==undefined) battle.disp[e.t].y = e.y; }
    if (e.k==='ring') battle.rings = e.n;
    if (e.k==='escape'){ battle.escaped++; battle.disp[e.t].fell = true; }
    if (e.k==='fall') battle.disp[e.t].fell = true;
    if (e.k==='spot') { /* 건너뛸 때는 표시만 생략 */ }
  }
  finishPlay();
}

/* ── 결과 분석 — 왜 이겼고 왜 졌는가 ── */
function condCand(c){
  return D.chars.filter(x => x.floor <= cur.n + 6 && !flat().includes(x.id) &&
    ((c.t==='역할' && x.role===c.v) || (c.t==='생업' && x.trade===c.v) ||
     (c.t==='시대' && x.era===c.v) ||
     (c.t==='층범위' && (()=>{const [a,b]=c.v.split('~').map(Number); return x.floor>=a&&x.floor<=b;})()) ||
     (c.t==='약체' && x.r<=2)));
}
function analyze(B){
  const why = [], tip = [];
  const t0 = teams.map(t => t.filter(Boolean));
  const mem = flat().map(id => CH[id]);

  // ── 전투 기록에서 실제 원인을 읽는다 ──
  const foeHP   = B.foes.reduce((a,f) => a + f.max, 0);
  const dealt   = B.allies.reduce((a,u) => a + u.dealt, 0);
  const allyHP  = B.allies.reduce((a,u) => a + u.max, 0);
  const taken   = B.allies.reduce((a,u) => a + u.taken, 0);
  const healed  = B.allies.reduce((a,u) => a + u.healed, 0);
  const cutPct  = Math.min(100, Math.round(dealt / foeHP * 100));
  const fell    = B.allies.filter(u => u.hp === 0).sort((x,y) => x.fellAt - y.fellAt);

  if (B.win){
    why.push({bad:0, s:`수호자의 잔존을 <b>${B.round}턴</b>에 전부 깎았습니다`});
    if (healed) why.push({bad:0, s:`받은 피해 ${taken} 중 <b>${healed}</b> 를 회복으로 되돌렸습니다`});
    else why.push({bad:1, s:`회복 없이 버텼습니다 — 더 어려운 층에서는 위험합니다`});
    if (fell.length) why.push({bad:1, s:`${fell.length}명은 흐려졌습니다 — <b>${fell[0].nm}</b>가 ${fell[0].fellAt}턴에 먼저`});
  } else {
    why.push({bad:1, s:`수호자의 잔존을 <b>${cutPct}%</b>까지만 깎았습니다`});
    why.push({bad:1, s:`${B.allies.length}명 중 <b>${fell.length}명</b>이 흐려졌습니다`});
    if (healed > 0) why.push({bad:0, s:`회복은 <b>${healed}</b> 했지만 받은 피해 ${taken} 을 따라가지 못했습니다`});
    else why.push({bad:1, s:`회복이 <b>전혀 없었습니다</b>`});
    if (fell.length) why.push({bad:1, s:`처음 쓰러진 것은 <b>${fell[0].nm}</b> — ${fell[0].fellAt}턴`});
  }

  // ── 전투력 지표가 맞았는가 ──
  t0.forEach((t,i) => {
    const tp = teamPower(t), need = B.req[i], head = t0.length>1 ? `${i+1}팀 ` : '';
    if (tp >= need && !B.win)
      why.push({bad:1, s:`${head}전투력은 ${tp}/${need} 로 <b>충족했지만 졌습니다</b> — 수치가 아니라 구성 문제입니다`});
    else if (tp < need)
      why.push({bad:1, s:`${head}전투력 ${tp} / 요구 ${need} — <b>${need-tp} 부족</b>`});
  });

  // ── 구성 진단 ──
  const cnt = r => mem.filter(m => m.role === r).length;
  const best = (r, key) => D.chars
    .filter(c => c.floor <= cur.n + 6 && !flat().includes(c.id) && (!r || c.role === r))
    .sort((x,y) => y[key] - x[key])[0];

  if (!B.win){
    if (cutPct < 60){
      const c = best('저항','atk') || best(null,'atk');
      tip.push({t:'화력이 모자랍니다', d:`적 잔존을 ${cutPct}%밖에 못 깎았습니다. 의지가 높은 잔상을 넣으세요.`,
                c: c ? `${c.name} (${c.role} · 의지 ${c.atk})` : null});
    }
    if (cnt('헌신') === 0){
      const c = best('헌신','atk');
      tip.push({t:'회복이 없습니다', d:'헌신 역할이 없어 깎인 잔존이 돌아오지 않았습니다.',
                c: c ? `${c.name} (헌신 · 의지 ${c.atk})` : null});
    } else if (healed < allyHP * 0.15){
      tip.push({t:'회복이 부족합니다', d:`전투 내내 ${healed}만 회복했습니다. 헌신을 한 명 더 넣거나 더 오래 버틸 편성이 필요합니다.`, c:null});
    }
    if (cnt('수호') === 0){
      const c = best('수호','def');
      tip.push({t:'막아설 사람이 없습니다', d:'수호 역할이 없어 공격이 약한 잔상에게 그대로 들어갔습니다.',
                c: c ? `${c.name} (수호 · 자취 ${c.def})` : null});
    }
    if (fell.length && fell[0].fellAt <= 4){
      tip.push({t:`${fell[0].nm}가 너무 일찍 쓰러졌습니다`, d:'자취가 낮은 잔상은 수호와 함께 넣거나 빼세요.', c:null});
    }
  }

  // ── 아직 열지 않은 열쇠 ──
  const usedPw = Math.min(...B.routes.map(x => x.pw));
  cur.routes.filter(r => r.cond.length && r.pw < usedPw).forEach(r => {
    if (t0.some(t => routeMet(r, t))) return;
    const miss = r.cond.filter(c => !t0.some(t => condMet(c, t)));
    const cands = miss.flatMap(condCand).slice(0, 3);
    tip.push({t:`「${ROUTE_NAME[r.id]||r.id}」 경로가 닫혀 있습니다`,
      d:`열면 요구가 ${Math.round(usedPw*100)}% → ${Math.round(r.pw*100)}% 로 내려갑니다. 필요 · ${miss.map(condLabel).join(' · ')}`,
      c: cands.length ? cands.map(c => c.name).join(' / ') : '보유 잔상 중에는 조건을 채울 사람이 없습니다'});
  });

  if (!tip.length && !B.win)
    tip.push({t:'편성으로는 더 낼 것이 없습니다', d:'이 층은 지금 로스터로는 벅찹니다. 아래 층을 먼저 열어 잔상을 더 모으세요.', c:null});

  return { why, tip, fell };
}

const GW = MAPW, GH = MAPH;
const TCLS = {'.':'t-plain','#':'t-block',':':'t-rubble','~':'t-crack','_':'t-drain',
              '^':'t-high','o':'t-cover','w':'t-water','x':'t-fire'};
function cx(x){ return (x + 0.5) / GW * 100; }
function cy(y){ return (y + 0.5) / GH * 100; }
function terrainLayer(){
  const m = cur.map; if (!m) return '';
  let out = '';
  for (let y=0; y<GH; y++)
    for (let x=0; x<GW; x++){
      const ch = m[y][x] || '.';
      if (ch === '.') continue;
      out += `<div class="cell ${TCLS[ch]||'t-plain'}" style="left:${x/GW*100}%;top:${y/GH*100}%;`
           + `width:${100/GW}%;height:${100/GH}%"></div>`;
    }
  for (let x=1; x<GW; x++)
    out += `<div class="gridline" style="left:0;top:0;height:100%;width:${x/GW*100}%"></div>`;
  return out;
}
function legend(){
  const m = cur.map; if (!m) return '';
  const used = new Set(m.join('').split('').filter(c => c !== '.'));
  const T = D.terrain || {};
  const rows = [...used].map(ch => {
    const t = T[ch]; if (!t) return '';
    const col = {'#':'var(--ink)',':':'var(--muted)','~':'var(--bad)','_':'var(--slate)',
                 '^':'var(--ember)','o':'var(--ok)','w':'var(--slate)','x':'var(--bad)'}[ch];
    return `<span><i style="background:${col};opacity:.5"></i>${t.n} — ${t.desc}</span>`;
  }).join('');
  return rows ? `<div class="legend">${rows}</div>` : '';
}

/* ── 렌더 ── */
function renderFloors(){
  el('floors').innerHTML = D.floors.map(f =>
    `<button class="fl${f.n===cur.n?' on':''}" data-f="${f.n}">
       <b>${String(f.n).padStart(3,'0')}</b>${f.name}
       <i>${f.teams>1?f.teams+'팀':''}</i></button>`).join('');
}
function renderRoster(){
  const used = new Set(flat());
  el('roster').innerHTML = owned().map(c =>
    `<button class="ch" data-c="${c.id}" ${used.has(c.id)?'disabled':''}>
       <img src="${c.sp}" alt="">
       <span><b>${c.name}</b>
         <span class="st">${'★'.repeat(c.r)}</span>
         <span>${c.role} · ${c.trade} · ${c.pw}</span>
         <span class="tr">${c.trait&&c.trait.name?'「'+c.trait.name+'」':''}</span></span>
     </button>`).join('');
}
function renderMain(){
  if (battle) return renderBattle();
  const tp = teams.map(teamPower), rt = teams.map(bestRoute);
  const needs = teams.map((t,i) => Math.round(cur.base/cur.teams*rt[i].pw));
  const ready = teams.every(t => t.filter(Boolean).length > 0);
  el('main').innerHTML = `
   <h2 style="font-size:1.15rem">${cur.n}층 · ${cur.name}<span style="font-size:.72rem;color:var(--faint);margin-left:.6rem" class="mono">${cur.era} · ${cur.teams}팀 ${cur.need}명</span></h2>
   <div class="goalbar"><span class="g">${(cur.goal||{}).name||''}</span></div>
   <div class="envs">${(cur.envInfo||[]).map(e=>`<span class="env"><b>${e.name}</b> · ${e.desc}</span>`).join('')}</div>
   ${legend()}
   <div class="field" style="height:11rem;margin-bottom:.8rem">${terrainLayer()}</div>
   <p class="hint" style="margin-top:-.4rem">${cur.mapNote||''}</p>
   <div class="teams">${teams.map((t,i)=>`
     <div class="team"><div class="lab">${cur.teams>1?(i+1)+'팀':'편성'} · ${teamPower(t)} / ${needs[i]}
       <span class="${tp[i]>=needs[i]?'ok':'no'}" style="color:${tp[i]>=needs[i]?'var(--ok)':'var(--bad)'}">${tp[i]>=needs[i]?'충족':'부족'}</span></div>
       <div class="slots">${t.map((id,j)=>id
         ? `<button class="slot filled" data-rm="${i}:${j}" title="${CH[id].name}"><img src="${CH[id].sp}" alt=""><span class="x">×</span></button>`
         : `<button class="slot" data-add="${i}:${j}"></button>`).join('')}</div>
     </div>`).join('')}</div>
   <div class="lab">경로 — 조건을 갖추면 요구 전투력이 내려간다</div>
   ${cur.routes.map(r=>{
      const met = teams.some(t => routeMet(r,t));
      const cd = r.cond.length ? r.cond.map(condLabel).join(' · ') : '조건 없음';
      return `<div class="route${met?' met':''}"><span class="rn">${ROUTE_NAME[r.id]||r.id} <span style="color:var(--faint);font-size:.74rem">${cd}</span></span>
        <span class="mult">${Math.round(r.pw*100)}%</span></div>`;
   }).join('')}
   <div class="row">
     <button id="go" ${ready?'':'disabled'}>등반</button>
     <button id="auto">자동 편성</button>
     <button id="clr">비우기</button>
     ${ready?'':'<span class="warn">각 팀에 최소 1명</span>'}
   </div>
   <p class="hint" style="color:var(--ember)">각 잔상은 자기 성향대로 판단합니다. 카브릴은 물러서지 않고, 미로는 위험하면 빠집니다.</p>
   <p class="hint">슬롯을 누르면 로스터에서 고를 수 있습니다. 전투력이 부족해도 등반은 됩니다 — 이길 수 있는지가 다를 뿐입니다.</p>`;
}
function unitCard(u, side){
  const d = battle.disp[u.uid];
  const pct = d.hp / d.max * 100;
  const art = u.sp ? `<img src="${u.sp}" alt="">` : `<div class="fg"></div>`;
  const cls = ['un', side, d.fell?'fell':'', u.ref?'ref':''].filter(Boolean).join(' ');
  return `<div class="${cls}" data-u="${u.uid}" style="left:${cx(d.x)}%;top:${cy(d.y)}%">
    ${art}<div class="hb"><i style="width:${pct}%"></i></div>
    <div class="un-nm">${u.nm}</div></div>`;
}
function goalLine(B){
  const G = B.goal;
  let prog = '';
  if (G.t==='생존') prog = `${B.round} / ${G.n}턴`;
  else if (G.t==='대피') prog = `${B.escaped} / ${G.n}명`;
  else if (G.t==='타종') prog = `${B.rings} / ${G.n}번`;
  else if (G.t==='전멸') prog = `${B.foes.filter(f=>battle.disp[f.uid].hp>0).length}명 남음`;
  else if (G.t==='도달') prog = `${Math.max(...B.allies.map(a=>Math.round(battle.disp[a.uid].x)))} / ${GW-1}`;
  return `<div class="goalbar"><span class="g">${G.name}</span><span class="prog">${prog}</span></div>`;
}
function renderBattle(){
  const B = battle;
  const playing = B.pb && !B.pb.done;
  const post = (B.goal.t==='도달'||B.goal.t==='대피'||B.goal.t==='타종')
    ? `<div class="goalpost" style="left:${(GW-0.5)/GW*100}%"></div>` : '';
  const field = legend() + `<div class="field" id="field">${terrainLayer()}${post}
      ${B.allies.map(u=>unitCard(u,'ally')).join('')}
      ${(B.refugees||[]).map(u=>unitCard(u,'ally')).join('')}
      ${B.foes.map(u=>unitCard(u,'foe')).join('')}
    </div>
    <div class="ticker" id="ticker"></div>`;

  if (playing){
    el('main').innerHTML = goalLine(B) + field + `
      <div class="ctl">
        <button id="pause">멈춤</button>
        <button id="spd">속도 ×${B.pb.speed}</button>
        <button id="skip">끝까지 보기</button>
        <span class="sp">${cur.n}층 · ${B.routes.map(r=>ROUTE_NAME[r.id]||r.id).join(' / ')} 경로</span>
      </div>`;
    return;
  }

  const A = analyze(B);
  const top = [...B.allies].sort((x,y)=>y.dealt-x.dealt)[0];
  el('main').innerHTML = goalLine(B) + field + `
   <div class="res ${B.win?'win':'lose'}">
     <div class="verdict">${B.win?'층을 열었다':'실패'}</div>
     <div style="font-size:.86rem;margin-top:.2rem">${B.reason||''}</div>
     <div class="pwline">${B.routes.map((r,i)=>`<span>${B.routes.length>1?(i+1)+'팀 ':''}<b>${ROUTE_NAME[r.id]||r.id}</b> 경로 · 요구 ${Math.round(r.pw*100)}%</span>`).join('')}
       <span>${B.round}턴</span></div>
   </div>
   <div class="why">
     <div class="lab">${B.win?'무엇이 통했나':'왜 실패했나'}</div>
     ${A.why.map(w=>`<div class="wl ${w.bad?'no':'ok'}"><span>${w.bad?'✕':'○'}</span><span>${w.s}</span></div>`).join('')}
     ${top&&top.dealt?`<div class="wl ok"><span>○</span><span>가장 많이 때린 것은 <b>${top.nm}</b> (${top.dealt})</span></div>`:''}
   </div>
   ${A.tip.length?`<div class="why tips">
     <div class="lab">다음에 해볼 것</div>
     ${A.tip.map(t=>`<div class="tp"><b>${t.t}</b>
       <div class="need">${t.d}</div>
       ${t.c?`<div class="need">→ ${t.c}</div>`:''}</div>`).join('')}
   </div>`:''}
   <details class="det"><summary>전투 기록 ${B.round}턴</summary>
   <div class="log">${B.log.map(l=>`<div class="${l.cls}">${l.s}</div>`).join('')}</div></details>
   <div class="row"><button id="back">편성 바꾸기</button><button id="again">같은 편성으로 다시</button></div>`;
}
function render(){ renderFloors(); renderRoster(); renderMain(); }

/* ── 입력 ── */
let picking = null;
document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.f){ cur = D.floors.find(f=>f.n===+t.dataset.f); resetTeams(); render(); return; }
  if (t.dataset.add){ picking = t.dataset.add.split(':').map(Number);
    el('roster').scrollIntoView({block:'nearest'}); document.body.dataset.pick='1'; return; }
  if (t.dataset.rm){ const [i,j]=t.dataset.rm.split(':').map(Number); teams[i][j]=null; render(); return; }
  if (t.dataset.c){
    let slot = picking;
    if (!slot){ for (let i=0;i<teams.length&&!slot;i++){ const j=teams[i].indexOf(null); if (j>=0) slot=[i,j]; } }
    if (!slot) return;
    teams[slot[0]][slot[1]] = t.dataset.c; picking = null; render(); return;
  }
  if (t.id==='pause'){
    if (timer){ clearInterval(timer); timer=null; t.textContent='이어서'; }
    else { startPlay(); t.textContent='멈춤'; }
    return; }
  if (t.id==='spd'){ battle.pb.speed = battle.pb.speed>=4?1:battle.pb.speed*2;
    t.textContent = `속도 ×${battle.pb.speed}`; if (timer) startPlay(); return; }
  if (t.id==='skip'){ skipPlay(); return; }
  if (t.id==='go'){ startBattle(); return; }
  if (t.id==='again'){ startBattle(); return; }
  if (t.id==='back'){ if(timer){clearInterval(timer);timer=null;} battle=null; render(); return; }
  if (t.id==='clr'){ resetTeams(); render(); return; }
  if (t.id==='auto'){
    resetTeams();
    const pool = [...owned()].sort((a,b)=>b.pw-a.pw);
    // 열쇠 조건을 만족시킬 후보를 먼저 넣는다
    const wanted = cur.routes.flatMap(r=>r.cond).filter(c=>c.t!=='약체');
    const put = c => { for (let i=0;i<teams.length;i++){ const j=teams[i].indexOf(null);
      if (j>=0 && !flat().includes(c.id)){ teams[i][j]=c.id; return true; } } return false; };
    wanted.forEach(w=>{
      const m = pool.find(c => !flat().includes(c.id) &&
        ((w.t==='역할'&&c.role===w.v)||(w.t==='생업'&&c.trade===w.v)||(w.t==='시대'&&c.era===w.v)));
      if (m) put(m);
    });
    pool.forEach(c => { if (!flat().includes(c.id)) put(c); });
    render(); return;
  }
});
resetTeams(); render();
</script>
