<!doctype html>
<meta charset="utf-8">
<title>이렘의 탑 — 뜰 (브라우저 재생)</title>
<!--
  뜰을 브라우저에서 본다.

  유니티가 이 서버에 없다. 그래서 GardenDirector 가 세우는 화면을 눈으로 볼 수가 없었다.
  그런데 계산은 순수 C# 이고(Irem.Sim/Garden.cs) 3D 몸은 이미 GLB 로 있다(chars/out/cast).
  그래서 **여기서는 아무것도 계산하지 않는다.** Tools/GardenRunner 가 굽어 둔
  viewer/garden.json — 유니티가 재생할 그 사건 목록 — 을 그대로 재생만 한다.

  두 벌로 갈라지면 안 되는 것을 여기에 다시 적지 않았다:
    · 사건 목록          → Garden.Tick() 이 만든 것을 읽기만 한다
    · 칸 자리            → Ground3D.Cell(x,y) = (x, 0, -y) 와 같은 식
    · 타일 고르는 법     → ArtLoad.TileName 과 같은 식 (abs(x*7+y*13+ch) % 5)
    · 땅 메시 감는 법    → Ground3D.Slab 과 같은 순서
    · 실루엣 칠하는 법   → Art/Chars/Silhouette.shader 의 식을 GLSL 로 옮겼다
    · 동작 섞는 법       → ShadeView3D (0.25초 크로스페이드, walk 는 한 걸음(STEP) 유지)
    · 재생 규칙          → GardenDirector.Step (한 박자에 한 걸음)
  식을 옮긴 곳은 옆에 원본 파일을 적어 두었다. 숫자가 갈리면 그 줄을 보라.

  유니티와 다른 것 (정직하게):
    · 끝이 있다. 유니티는 재생이 계산을 따라잡으면 Garden.Tick() 을 한 번 더 부른다.
      브라우저는 계산을 못 하므로(안 하므로) 구운 걸음까지 재생하고 처음으로 돌아간다.
    · 드래그로 돌려 볼 수 있다. 유니티 쪽 카메라는 정해진 각으로만 본다.
    · 이것이 통과한 것은 「계산과 재생 규칙이 맞다」는 뜻이다.
      「유니티에서 돈다」는 뜻이 아니다 — Irem.Game 의 C# 은 여기서 컴파일된 적이 없다.
-->

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { clone as skClone } from 'three/addons/utils/SkeletonUtils.js';

const boot = document.getElementById('boot'), bootmsg = document.getElementById('bootmsg');
const say = s => bootmsg.innerHTML = s;
const fail = s => { boot.innerHTML = `<div style="max-width:620px;padding:20px"><b class="bad">세우지 못했다.</b><div class="sub" style="color:#8b8279;margin-top:8px">${s}</div></div>`; };
addEventListener('error', e => fail('자바스크립트 오류 — ' + (e.message||e)));

/* ── 굽어 둔 사건 목록. 여기서 다시 계산하지 않는다 ───────────────── */
const G = await (await fetch('garden.json?v=' + Date.now())).json();
const K = {};                       // 'Walk' → 번호. kinds 는 C# 의 Enum.GetNames(typeof(Gv))
G.kinds.forEach((n,i) => K[n] = i);
const C = {};                       // 'turn' → 열 번호. cols 는 GardenRunner 가 적어 둔다
G.cols.forEach((n,i) => C[n] = i);
const CAST = G.cast, NST = G.stations;
const REPO = '../';                 // viewer/ 에서 저장소 뿌리로

/* 전승 스물셋이 역할 다섯 벌을 저마다 덮어쓰는 값 (data/shades.json · chars/src/shades.py).
   두 층이다 — 몸집(macro)은 블렌더가 미리 구웠고 여기서는 그 사람 GLB 를 고르기만 한다.
   자세와 비대칭(bones)은 굽지 않는다. 클립이 계산된 **뒤에** 뼈에 얹는다.
   구워 넣을 수 없는 이유는 make_demo.py:base_pose() 주석에 있다 — NLA 누수를 막으려고
   네 동작이 전부 같은 뼈 집합을 0 까지 찍는다. 쉼자세에 굽은 등을 넣어도 클립이 펴 버린다. */
const SHADES = await fetch(REPO + 'data/shades.json?v=' + Date.now())
  .then(r => r.ok ? r.json() : null).then(d => d ? d.shades : {}).catch(() => ({}));
/* 몸집을 덮어쓴 사람은 자기 GLB 가 따로 있다. 나머지는 역할·계층 쉰다섯 벌을 그대로 쓴다. */
const bodyOf = c => (SHADES[c.id] && Object.keys(SHADES[c.id].macro || {}).length)
  ? c.id : c.slug;

document.getElementById('ncast').textContent = CAST.length;
document.getElementById('nst').textContent = NST.length;
document.getElementById('head').innerHTML =
  `시드 ${G.seed} · 구운 걸음 ${G.ticks} · 사건 ${G.log.length.toLocaleString()}건 · 지도 ${G.w}×${G.h}` +
  `<br>계산은 <code>Irem.Sim/Garden.cs</code> 가 끝냈다. 이 페이지는 재생만 한다.`;

/* ── 무대 ────────────────────────────────────────────────────────── */
const PITCH = 35;                   // GardenDirector.Pitch
const FOV   = 42;                   // GardenDirector.FrameCamera
/* 한 칸(1m)을 지나는 시간. 0.34초면 2.94 m/s 인데 그건 걷기가 아니라 달리기다.
   실측한 다리 속도가 1.14~1.28 m/s 여서 그 가운데에 맞춘다 (1/0.82 = 1.22 m/s).
   GardenDirector.StepSeconds 와 같은 값이어야 한다. */
let STEP    = 0.82;                 // GardenDirector.StepSeconds
const STEP0 = 0.82;
const canvas = document.getElementById('c');
const rend = new THREE.WebGLRenderer({canvas, antialias:true});
rend.setPixelRatio(Math.min(devicePixelRatio, 2));
rend.setClearColor(0x141210);        // 유니티 쪽 backgroundColor 와 같은 값
const sc  = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(FOV, innerWidth/innerHeight, 0.3, 260);
const ctrl = new OrbitControls(cam, canvas);
ctrl.enableDamping = true; ctrl.dampingFactor = 0.08;

/* 칸 하나가 1m — Ground3D.Cell(x,y) = (x, 0, -y) 와 같은 자리다.
   다만 z 부호가 반대다. 유니티는 왼손 좌표, three.js 는 오른손 좌표여서
   같은 숫자를 그대로 쓰면 지도가 좌우로 뒤집혀 보인다(실제로 그렇게 나왔다).
   「지도의 위쪽이 화면의 위쪽」이 Ground3D 주석이 정한 것이므로 그쪽을 지킨다.
   뒤집는 데는 이 한 줄과 바로 아래 카메라 앞방향뿐이다. */
const at = (x,y) => {
  const row = G.map[y]; if (row === undefined) return '.';
  return x < 0 || x >= row.length ? '.' : row[x];
};
/* 칸의 바닥 높이. 표에서 온다 — 여기서 정하지 않는다(tools/make_garden.py:TERRAIN).
   이것이 없을 때 담도 언덕도 우물물도 바닥에 그린 무늬였다. */
const TERH = {}, TERB = {};
for (const t of (G.terrain || [])) { TERH[t.ch] = t.h; TERB[t.ch] = t.block; }
const hAt = (x,y) => TERH[at(x,y)] ?? 0;
const cell = (x,y) => new THREE.Vector3(x, hAt(x,y), y);
const CENTER = new THREE.Vector3((G.w-1)/2, 0, (G.h-1)/2);

/* 뜰 전체가 들어가는 거리 — GardenDirector.WholeGarden 과 같은 식 */
function wholeGarden() {
  const vr = Math.tan(FOV*0.5*Math.PI/180), hr = vr*Math.max(0.5, cam.aspect);
  const dw = (G.w*0.5 + 1.5)/Math.max(0.05, hr);
  // 세로에는 건물 높이가 들어간다. 땅만 재면 종탑(8.45m)과 등대 꼭대기가 잘린다.
  const tall = Math.max(0, ...NST.map(s => (s.z0 || 0) +
      Math.max(0, ...(s.parts || []).map(q =>
        q.p[2] + (q.t === 'cyl' ? q.s[1] : q.s[2])))));
  const dh = (G.h*0.5*Math.cos(PITCH*Math.PI/180) + tall*0.5*Math.sin(PITCH*Math.PI/180)
              + 1.5)/Math.max(0.05, vr);
  return Math.max(dw, dh);
}
/* 따라갈 때 어느 각으로 내려볼 것인가. 마을이 서기 전에는 늘 35도였다 —
   뜰이 평평해서 가릴 것이 없었기 때문이다. 이제 대장간을 따라가면 카메라가 지붕
   속에 들어앉는다(실제로 들어갔다).

   가까이 당기는 것으로는 안 된다. 그러면 벽 안으로 들어갈 뿐이다(한 번 해 봤다).
   가릴 것이 있으면 각을 세워 지붕 위로 올라간다. 거리는 9m 그대로 둔다. */
const ray = new THREE.Raycaster();
const PITCHES = [PITCH, 50, 65, 80];
function followFwd(look, d) {
  for (const deg of PITCHES) {
    const r = deg*Math.PI/180;
    const f = new THREE.Vector3(0, -Math.sin(r), -Math.cos(r));
    ray.set(look, f.clone().negate());
    ray.far = d;
    const hit = ray.intersectObjects([ground3, props3], true);
    if (!hit.some(h => h.distance > 0.35)) return f;
  }
  const r = PITCHES[PITCHES.length-1]*Math.PI/180;
  return new THREE.Vector3(0, -Math.sin(r), -Math.cos(r));
}
/* 카메라 앞방향. 유니티는 Quaternion.Euler(35,0,0) → (0,-sin35,+cos35) 이고,
   여기는 z 를 뒤집었으므로 (0,-sin35,-cos35) 다. 내려보는 각은 같은 35도다. */
const FWD = new THREE.Vector3(0, -Math.sin(PITCH*Math.PI/180), -Math.cos(PITCH*Math.PI/180));
const eye = (look, d) => look.clone().addScaledVector(FWD, -d);
function frameWide() {
  const d = wholeGarden();
  cam.position.copy(eye(CENTER, d)); ctrl.target.copy(CENTER); ctrl.update();
}

/* ── 땅 — 타일 그림은 2D 전투가 쓰는 것을 그대로 쓴다 ─────────────── */
/* ArtLoad.TileName 과 같은 식이다. 갈리면 땅이 딴 그림이 된다. */
const TILEKEY = {'#':'block', ':':'rubble', '~':'crack', '_':'drain',
                 '^':'high',  'o':'cover',  'w':'water', 'x':'fire'};
function tileName(ch, x, y, variants=5) {
  const k = TILEKEY[ch] || 'plain';
  return k + '_' + (Math.abs(x*7 + y*13 + ch.charCodeAt(0)) % Math.max(1, variants));
}
/* 칸마다 높이가 있다. 윗면을 그 높이에 깔고, 옆이 더 낮은 쪽으로만 옆면을 세운다.
   안쪽으로 맞닿은 면은 만들지 않는다 — 담 스물두 칸이 속까지 삼각형이 되면
   보이지도 않는 면을 몇 천 장 그리게 된다. */
const ground3 = new THREE.Group(); sc.add(ground3);   // 따라가는 카메라가 여기에 한 줄 쏜다
function buildGround() {
  const group = new Map();
  const bucket = n => { if (!group.has(n)) group.set(n, {v:[], uv:[], nm:[], ix:[]}); return group.get(n); };
  const quad = (g, P, N) => {
    const b = g.v.length / 3;
    const U = [[0,0],[0,1],[1,1],[1,0]];
    for (let k = 0; k < 4; k++) {
      g.v.push(P[k][0], P[k][1], P[k][2]);
      g.uv.push(U[k][0], U[k][1]);
      g.nm.push(N[0], N[1], N[2]);
    }
    g.ix.push(b, b+1, b+2, b, b+2, b+3);
  };
  for (let y = 0; y < G.h; y++) for (let x = 0; x < G.w; x++) {
    const ch = at(x,y), n = tileName(ch, x, y), h = hAt(x,y);
    const g = bucket(n);
    /* 윗면 — Ground3D.Slab 과 같은 순서로 감는다 */
    quad(g, [[x-.5,h,y-.5],[x-.5,h,y+.5],[x+.5,h,y+.5],[x+.5,h,y-.5]], [0,1,0]);
    /* 옆면 — 이웃이 낮은 쪽만. 뜰 밖은 0 으로 본다 */
    const sides = [[ 1,0, [[x+.5,0,y-.5],[x+.5,0,y+.5]], [ 1,0,0]],
                   [-1,0, [[x-.5,0,y+.5],[x-.5,0,y-.5]], [-1,0,0]],
                   [0, 1, [[x+.5,0,y+.5],[x-.5,0,y+.5]], [0,0, 1]],
                   [0,-1, [[x-.5,0,y-.5],[x+.5,0,y-.5]], [0,0,-1]]];
    for (const [dx,dy,edge,nrm] of sides) {
      const nh = (x+dx < 0 || x+dx >= G.w || y+dy < 0 || y+dy >= G.h) ? 0 : hAt(x+dx, y+dy);
      if (h - nh < 1e-4) continue;
      const a = edge[0], b = edge[1];
      quad(g, [[a[0],h,a[2]],[a[0],nh,a[2]],[b[0],nh,b[2]],[b[0],h,b[2]]], nrm);
    }
  }
  const tl = new THREE.TextureLoader();
  for (const [n, g] of group) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(g.v), 3));
    geo.setAttribute('uv',       new THREE.BufferAttribute(new Float32Array(g.uv), 2));
    geo.setAttribute('normal',   new THREE.BufferAttribute(new Float32Array(g.nm), 3));
    geo.setIndex(g.ix);
    const tex = tl.load(REPO + 'unity/Assets/Resources/Irem/Tiles/' + n + '.png');
    tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    /* 감는 방향이 z 를 뒤집으면서 같이 뒤집힌다. 수평 한 장이라 양면으로 둔다. */
    ground3.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map:tex, side:THREE.DoubleSide})));
  }
}
buildGround();

/* ── 실루엣 — Art/Chars/Silhouette.shader 를 옮긴 것 ──────────────── */
/* 셋만 한다: 단색으로 칠하고, 한 방향 빛으로 20%만 밝기를 주고, 발밑에서 알파를 깎는다. */
const SIL_V = `
  #include <common>
  #include <skinning_pars_vertex>
  varying vec3 vN; varying float vY;
  void main() {
    #include <beginnormal_vertex>
    #include <skinbase_vertex>
    #include <skinnormal_vertex>
    #include <defaultnormal_vertex>
    vN = transformedNormal;
    #include <begin_vertex>
    #include <skinning_vertex>
    #include <project_vertex>
    vY = (modelMatrix * vec4(transformed, 1.0)).y - modelMatrix[3][1];
  }`;
const SIL_F = `
  uniform vec3 colour; uniform vec3 lightDir;
  uniform float wrap, fadeTop, fadeOn;
  varying vec3 vN; varying float vY;
  void main() {
    float l = (1.0 - wrap) + wrap * clamp(dot(normalize(vN), normalize(lightDir)), 0.0, 1.0);
    float a = mix(1.0, smoothstep(0.0, max(1e-4, fadeTop), vY), fadeOn);
    if (a < 0.01) discard;
    gl_FragColor = vec4(colour * l, a);
  }`;
function silMat(hex, fadeOn = 1) {
  return new THREE.ShaderMaterial({
    vertexShader:SIL_V, fragmentShader:SIL_F,
    uniforms:{ colour:{value:new THREE.Color(hex)},

/* 잔상 한 명. ShadeView3D 와 같은 말을 알아듣는다 —
   Play / MoveRig / Warp / FaceTo 뿐이다. */
class Shade {
  constructor(def, root, gltf) {
    this.def = def; this.root = root;
    this.mixer = new THREE.AnimationMixer(root);
    this.clips = {};
    for (const [en, ko] of Object.entries(CLIP)) {
      const a = gltf.animations.find(x => x.name === ko);
      if (a) this.clips[en] = a;
    }
    this.act = null; this.name = ''; this.hold = 0; this.rest = 0;
    /* 몸의 박자. 계산하는 쪽이 소금에서 낸 값이고(GardenSetup) 유니티도 같은 값을
       쓴다 — 여기서 따로 굴리면 같은 뜰이 두 가지로 움직인다. */
    this.phase = def.phase ?? 0;
    this.tempo = def.tempo ?? 1;
    this.breath = def.breath ?? 0;
    this.yaw = 0; this.yawWant = 0;
    this.from = root.position.clone(); this.to = root.position.clone();
    this.left = 0; this.dur = 1; this.speed = 0;
    this.stance = stance(root, SHADES[def.id]);
    this.stride = this.measureStride();
    this.play('idle', true);
  }
  /* 걸음폭을 잰다 — 발이 몸을 기준으로 앞뒤로 오간 길이다.
     한 바퀴(왼발 한 번·오른발 한 번)에 그 두 배만큼 땅이 지나가야 디딘 발이
     제자리에 선다. 실측: 0.786~0.882m, 한 바퀴 1.375초 → 다리는 1.14~1.28 m/s 를
     낸다. 그런데 뜰은 한 칸(1m)을 0.34초에 옮겼다 — 2.94 m/s 다. 두 배 반을
     끌려간 셈이고, 그래서 다리는 걷는 시늉만 하고 몸은 미끄러졌다.
     다리 길이가 사람마다 다르므로 이 값도 사람마다 다르다. 그 차이가 그대로
     걸음의 박자 차이가 된다 — 다리가 짧으면 종종거린다. */
  measureStride() {
    const a = this.clips.walk; if (!a) return 0;
    let foot = null;
    this.root.traverse(o => {
      if (foot || !o.isSkinnedMesh) return;
      foot = o.skeleton.bones.find(b => b.name === 'foot_l') || null;
    });
    if (!foot) return 0;
    const act = this.mixer.clipAction(a); act.reset().play();
    const v = new THREE.Vector3();
    let lo = Infinity, hi = -Infinity;
    const N = 48, dt = a.duration / N;
    for (let i = 0; i <= N; i++) {
      this.mixer.update(i ? dt : 0);
      foot.updateWorldMatrix(true, false);
      v.setFromMatrixPosition(foot.matrixWorld);
      this.root.worldToLocal(v);
      if (v.z < lo) lo = v.z;
      if (v.z > hi) hi = v.z;
    }
    this.mixer.stopAllAction();
    this.act = null; this.name = '';
    return hi - lo;
  }
  /* 지금 땅이 지나가는 속도에 다리를 맞춘다. 빠르게 보기(2배·4배)를 누르면
     땅이 그만큼 빨라지므로 다리도 같이 빨라져야 한다 — 그래서 STEP 을 그때그때 읽는다. */
  walkScale() {
    const a = this.clips.walk;
    if (!a || !(this.stride > 0.05)) return this.tempo;
    const ground = this.speed > 0.01 ? this.speed : 1 / STEP;
    return ground * a.duration / (2 * this.stride);
  }
  /* 하던 동작을 다시 걸지 않는다.
     되풀이하면 첫 프레임으로 되돌아간다. 사건은 걸음마다 「일한다」를 말하는데
     (실측: 한 걸음에 스물, 한 사람은 599걸음을 내리 일한다) 휘두름은 2.0초짜리다.
     그러니 0.34초마다 처음으로 튀었다 — 스물이 같은 프레임에서 함께. 팔을 휘두르는
     사람 스물이 아니라 같은 태엽 스물이다. 그것이 징그러웠던 이유다. */
  play(clip, force = false) {
    if (this.hold > 0 && !force) return;
    const a = this.clips[clip]; if (!a) return;
    const loop = (clip === 'idle' || clip === 'walk');
    if (this.name === clip && (loop || this.hold > 0)) {
      // 걷기는 걸음마다 다시 불린다. 다리를 처음으로 되돌리지 않고 시간만 늘린다 —
      // 안 그러면 한 걸음이 끝나는 자리에서 숨으로 떨어져 다리가 끊긴다.
      if (clip === 'walk') {
        this.hold = STEP;
        this.act.setEffectiveTimeScale(this.walkScale());   // 빠르게 보기를 눌렀을 수 있다
      }
      return;
    }
    const nx = this.mixer.clipAction(a);
    nx.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
    nx.clampWhenFinished = true;
    if (this.act && this.act !== nx) this.act.fadeOut(0.25);      // ShadeView3D.Fade
    nx.reset().setEffectiveWeight(1).fadeIn(this.act ? 0.25 : 0).play();
    // 걷기만은 제 박자가 아니라 땅의 속도를 따른다. 박자를 지키면 발이 미끄러진다.
    nx.setEffectiveTimeScale(clip === 'walk' ? this.walkScale() : this.tempo);
    // 도는 동작은 저마다 다른 곳에서 시작한다. 안 그러면 스물셋이 한 숨을 쉰다.
    if (loop) nx.time = this.phase * a.duration;
    this.act = nx; this.name = clip;
    this.hold = loop ? 0 : a.duration / this.tempo;
    // 한 번 휘두르고 나면 숨을 돌린다. 사람마다 다른 참이라 다시 겹치지 않는다.
    this.rest = clip === 'attack' ? this.breath : 0;
    if (clip === 'walk') this.hold = STEP;                        // ShadeView.Play 와 같은 값
  }
  moveRig(p, seconds) {
    this.from.copy(this.root.position); this.to.copy(p);
    this.dur = Math.max(0.02, seconds); this.left = this.dur;
    // 실제로 땅이 지나가는 속도다. 한 칸을 STEP 초가 아니라 STEP*0.85 에 건너가고
    // 남는 참은 서 있으므로, 걷는 동안은 이쪽이 빠르다. 다리는 이 값에 맞춘다.
    this.speed = this.to.distanceTo(this.from) / this.dur;
    this.faceTo(p);
    this.play('walk', true);
  }
  warp(p) { this.root.position.copy(p); this.from.copy(p); this.to.copy(p); this.left = 0; }
  /* 건너뛸 때. 미끄러지던 것을 끝난 자리에 놓는다 */
  settle() { this.root.position.copy(this.to); this.left = 0;
             this.yaw = this.yawWant; this.root.rotation.y = this.yaw; }
  faceTo(p) {
    const dx = p.x - this.root.position.x, dz = p.z - this.root.position.z;
    if (dx*dx + dz*dz < 1e-4) return;
    this.yawWant = Math.atan2(dx, dz);
  }
  pos() { return this.root.position; }
  update(dt) {
    if (this.left > 0) {
      this.left = Math.max(0, this.left - dt);
      const k = 1 - this.left/this.dur;
      this.root.position.lerpVectors(this.from, this.to, k);
    }
    if (this.hold > 0) {
      this.hold -= dt;
      // 동작이 끝나면 숨으로 돌아가고, 숨 돌리는 참만큼은 다음 일을 받지 않는다.
      if (this.hold <= 0) {
        const r = this.rest; this.rest = 0; this.hold = 0;
        this.play('idle', true);
        this.hold = r;
      }
    }
    // 돌아서는 것은 좌우 반전이 아니라 Y축 회전이다 — 3D 라서 그렇다
    let d = this.yawWant - this.yaw;
    while (d >  Math.PI) d -= Math.PI*2;
    while (d < -Math.PI) d += Math.PI*2;
    this.yaw += d * (1 - Math.exp(-dt*11));                        // ShadeView3D.TurnSpeed
    this.root.rotation.y = this.yaw;
    this.mixer.update(dt);
    /* 그 사람의 자세를 여기서 얹는다 — 클립이 뼈를 다 쓴 **뒤에**.
       먼저 얹으면 다음 mixer.update 가 그대로 덮어쓴다. */
    for (const e of this.stance) {
      if (e.q) e.bone.quaternion.multiply(e.q);
      if (e.scale) e.bone.scale.copy(e.scale);
    }
  }
}

/* 한 사람의 자세를 뼈에 얹을 수 있는 꼴로 바꿔 둔다. 한 번만 계산한다.

   각도는 클립과 같은 규약으로 적혀 있다 — 아마추어 축의 도 단위다
   (make_demo.py:89 X,Y,Z). 뼈마다 어느 쪽이 앞인지가 다르므로 그 축을 뼈
   자기 축으로 옮겨야 한다. 블렌더 쪽 qrot() 이 bone.matrix_local 로 하는
   일이고, 여기서는 같은 것을 스킨의 역바인드행렬에서 꺼낸다 —
   boneInverses[i] 를 뒤집으면 그 뼈의 쉼자세 행렬이다.

   굵기는 뼈 방향이 Y 라서 (primary_bone_axis) X·Z 만 올리면 굵어진다.
   클립은 굵기를 건드리지 않으니 덮어쓸 걱정이 없지만, 매 틀에 다시 적어 둔다 —
   나중에 굵기를 키우는 동작이 들어와도 자세가 조용히 사라지지 않게. */
function stance(root, entry) {
  const ops = entry && entry.bones;
  if (!ops) return [];
  let sk = null;
  root.traverse(o => { if (!sk && o.isSkinnedMesh) sk = o.skeleton; });
  if (!sk) return [];
  const out = [];
  const AX = [new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1)];
  for (const [name, op] of Object.entries(ops)) {
    const i = sk.bones.findIndex(b => b.name === name);
    if (i < 0) { console.warn('자세: 그런 뼈가 없다', name); continue; }
    const e = { bone: sk.bones[i] };
    if (op.rot && op.rot.some(v => v !== 0)) {
      // 쉼자세 행렬의 회전 부분. 이것의 역이 아마추어 축 -> 뼈 축이다.
      const rest = new THREE.Matrix3().setFromMatrix4(
        sk.boneInverses[i].clone().invert()).invert();
      const q = new THREE.Quaternion();
      op.rot.forEach((deg, k) => {
        if (!deg) return;
        const ax = AX[k].clone().applyMatrix3(rest);
        if (ax.lengthSq() < 1e-18) return;
        q.multiply(new THREE.Quaternion().setFromAxisAngle(
          ax.normalize(), deg * Math.PI / 180));
      });
      e.q = q;
    }
    if (op.scale) e.scale = new THREE.Vector3().fromArray(op.scale);
    if (e.q || e.scale) out.push(e);
  }
  return out;
}

/* 다 한꺼번에 받는다. 하나씩 기다리면 스물셋을 세우는 데 그만큼 곱절이 걸린다.
   받는 순서는 아무래도 좋다 — 세우는 순서는 아래에서 목록 차례대로다. */

/* ── 마을 ────────────────────────────────────────────────────────
   일터 열넷에 실제로 무엇이 서 있다. 모양은 여기서 정하지 않는다 —
   tools/places.py 가 적은 덩이 목록이 표로 넘어오고, 여기서는 세우기만 한다.
   유니티(Ground3D.Build)가 같은 목록을 같은 방식으로 세운다.

   전에는 일터에 pipeline3d 소품 하나만 놓였다. 실측 0.08~1.15m —
   등대가 8cm 였다. 저것은 건물이 아니라 손에 들던 연장이다.
   그래서 사람이 빈 뜰에 서서 허공에 손을 휘둘렀다. */
const PARTCOL = [0x7a7165, 0x6d543c, 0xc8903f];   // 0 돌 · 1 나무 · 2 쇠붙이·불빛
const partMats = PARTCOL.map((c, i) => new THREE.MeshStandardMaterial(
  {color: c, roughness: i === 2 ? 0.35 : 0.92, metalness: i === 2 ? 0.35 : 0,
   emissive: i === 2 ? new THREE.Color(c).multiplyScalar(0.3) : 0x000000,
   side: THREE.DoubleSide}));

/* 박공지붕·사각뿔은 three 에 없다. 꼭짓점으로 짓는다.
   감는 순서는 손으로 확인했다 — 밖에서 봤을 때 반시계로 감아야 법선이 바깥을 본다.
   처음에 한 면을 거꾸로 감았더니 지붕이 새까만 구멍으로 보였다. */
function faces(V, I) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(V), 3));
  g.setIndex(I); g.computeVertexNormals();
  return g;
}
/* 박공지붕. axis 가 'x' 면 용마루가 동서로, 'y' 면 남북으로 눕는다. */
function roofGeo(w, d, h, axis) {
  const x = w/2, z = d/2;
  if (axis === 'x') {
    //        0        1       2       3        4(용마루)  5
    const V = [-x,0,-z, x,0,-z, x,0,z, -x,0,z,  -x,h,0,  x,h,0];
    return faces(V, [3,2,5, 3,5,4,   1,0,4, 1,4,5,   0,3,4,   2,1,5]);
  }
  const V = [-x,0,-z, x,0,-z, x,0,z, -x,0,z,  0,h,-z,  0,h,z];
  return faces(V, [2,1,4, 2,4,5,   0,3,5, 0,5,4,   1,0,4,   3,2,5]);
}
/* 사각뿔. 네 면이 한 꼭짓점으로 모인다. */
function pyrGeo(w, d, h) {
  const x = w/2, z = d/2;
  return faces([-x,0,-z, x,0,-z, x,0,z, -x,0,z, 0,h,0],
               [1,0,4, 2,1,4, 3,2,4, 0,3,4]);
}
/* 덩이 하나 → 기하 하나. 좌표는 칸 단위 (x 동 · y 남 · z 위) —
   화면에서는 y 가 위이므로 (x, z, y) 로 눕혀 넣는다. */
function partGeo(q) {
  let g;
  if (q.t === 'box') {
    g = new THREE.BoxGeometry(q.s[0], q.s[2], q.s[1]); g.translate(0, q.s[2]/2, 0);
  } else if (q.t === 'cyl') {
    g = new THREE.CylinderGeometry(q.s[0], q.s[0], q.s[1], Math.max(3, q.n || 12));
    g.translate(0, q.s[1]/2, 0);
  } else if (q.t === 'roof') {
    g = roofGeo(q.s[0], q.s[1], q.s[2], q.a === 'x' ? 'x' : 'y');
  } else if (q.t === 'pyr') {
    g = pyrGeo(q.s[0], q.s[1], q.s[2]);
  } else return null;
  g.translate(q.p[0], q.p[2], q.p[1]);       // z(위) 를 y 로, y(남) 를 z 로
  return g;
}
/* 소품은 연장이다. 크기가 제각각이라(0.08~1.15m) 재서 손 크기로 맞춘다.
   숫자를 정해 두지 않는다 — 그 GLB 의 실제 크기에서 나온다. */
const TOOL = 0.42;
function toolScale(o) {
  const b = new THREE.Box3().setFromObject(o), sz = new THREE.Vector3();
  b.getSize(sz);
  const m = Math.max(sz.x, sz.y, sz.z);
  return m > 1e-4 ? TOOL / m : 1;
}

const stTops = new Map();            // 일터 이름 → 이름표를 띄울 높이
const stWork = new Map();            // 일터 이름 → 연장이 놓인 자리(세계 좌표)

async function buildStations() {
  for (const s of NST) {
    const base = cell(s.x, s.y), z0 = s.z0 || 0;
    const grp = new THREE.Group();
    grp.position.set(base.x, z0, base.z);
    let top = z0;
    for (const q of (s.parts || [])) {
      const g = partGeo(q); if (!g) continue;
      const m = new THREE.Mesh(g, partMats[Math.min(2, q.k|0)]);
      m.frustumCulled = false;
      m.userData.lit = m.material;
      m.userData.sil = silMat(STONE, 0);       // 실루엣일 때는 건물도 한 덩이다
      grp.add(m);
      const hi = q.p[2] + (q.t === 'cyl' ? q.s[1] : q.s[2]);
      if (hi > top - z0) top = z0 + hi;
    }
    if (grp.children.length) props3.add(grp);
    stTops.set(s.name, top);

    /* 연장을 작업대 위에 얹는다. 휘두르는 손이 여기를 지난다. */
    const w = s.work || [0, 0, 1];
    const wp = new THREE.Vector3(base.x + w[0], z0 + w[2], base.z + w[1]);
    stWork.set(s.name, wp);
    let g; try { g = await glb(REPO + 'pipeline3d/out/props/' + s.prop + '.glb'); }
    catch (e) { missProp++; continue; }
    const o = g.scene.clone(true);
    o.scale.setScalar(toolScale(o));
    o.position.copy(wp);
    const f = s.face || [0, -1];
    o.rotation.y = Math.atan2(-f[0], -f[1]);   // 연장이 일하는 사람을 향한다
    paint(o, STONE, 0);
    props3.add(o);
  }
}

async function buildCast() {
  for (const c of CAST) {
    let g; try { g = await glb(REPO + 'chars/out/cast/' + bodyOf(c) + '.glb'); }
    catch (e) { missBody++; continue; }
    const root = skClone(g.scene);      // 스킨 메시는 뼈까지 같이 복제해야 한다
    paint(root, c.col, 1);
    const sh = new THREE.Mesh(shadowGeo, shadowMat);
    sh.rotation.x = -Math.PI/2; sh.position.y = 0.02; root.add(sh);
    cast3.add(root);
    const v = new Shade(c, root, g);
    v.warp(cell(c.x, c.y));
    v.faceTo(CENTER);
    v.yaw = v.yawWant;
    views.set(c.idx, v);
  }
}
await fetchAll();
say('세우는 중…');
await buildStations();
await buildCast();
frameWide();

/* ── 이름표 · 말풍선 — GardenHud 가 하는 일 ──────────────────────── */
const tags = new Map(), bubs = new Map();
for (const c of CAST) {
  const t = document.createElement('div'); t.className = 'tag'; t.textContent = c.name;
  t.style.color = c.col; document.body.appendChild(t); tags.set(c.idx, t);
  const b = document.createElement('div'); b.className = 'bub'; b.style.display = 'none';
  document.body.appendChild(b); bubs.set(c.idx, {el:b, until:0});
}
const stags = NST.map(s => {
  const t = document.createElement('div'); t.className = 'tag st'; t.textContent = s.name;
  document.body.appendChild(t); return t;
});
function bubble(idx, text, sec = 2.2) {
  const b = bubs.get(idx); if (!b || !text) return;
  b.el.textContent = text; b.el.style.display = ''; b.until = now + sec;
}
const lines = [];
/* 같은 줄이 이어지면 겹쳐 세어 적는다. 카브릴과 레안은 정말 여러 번 다가갔고
   그 걸음은 저마다 다르지만, 같은 문장을 다섯 줄 쌓으면 읽는 쪽에는 고장으로 보인다. */
function feed(s) {
  if (!s) return;
  const last = lines[lines.length - 1];
  if (last && last.t === s) last.n++;
  else { lines.push({ t: s, n: 1 }); while (lines.length > 5) lines.shift(); }
  document.getElementById('lines').innerHTML =
    lines.map(x => `<div>${x.t}${x.n > 1 ? ` <span style="color:#8b8279">× ${x.n}</span>` : ''}</div>`).join('');
}

/* ── 오른쪽 목록 ─────────────────────────────────────────────────── */
let follow = -1;
document.getElementById('cast').innerHTML = CAST.map(c =>
  `<div class="row" data-i="${c.idx}"><span class="dot" style="background:${c.col}"></span>` +
  `<span class="who">${c.name}</span><span class="job">${c.place||'—'}</span></div>`).join('');
document.getElementById('cast').onclick = e => {
  const r = e.target.closest('.row'); if (!r) return;
  const i = +r.dataset.i;
  follow = follow === i ? -1 : i;                       // 같은 사람을 다시 누르면 놓는다
  [...document.querySelectorAll('#cast .row')].forEach(x => x.classList.toggle('on', +x.dataset.i === follow));
  document.getElementById('wide').classList.toggle('on', follow < 0);
};
document.getElementById('stations').innerHTML = NST.map(s =>
  `<div class="row"><span class="who">${s.name}</span><span class="job">${s.x},${s.y}</span></div>`).join('');
const nm = i => (i >= 0 && i < CAST.length) ? CAST[i].name : '';
document.getElementById('bonds').innerHTML = G.bonds.length
  ? G.bonds.map(b => `<div class="row"><span class="who">${nm(b.a)} ↔ ${nm(b.b)}</span>` +
      `<span class="job">${b.title}${b.shy ? ' · 아직' : ''}</span></div>`).join('')
  : '<div class="sub">없음</div>';

/* ── 재생 — GardenDirector.Step 이 하는 일을 그대로 한다 ──────────── */
const L = G.log;
const col = {turn:C.turn, k:C.k, a:C.a, t:C.t, x:C.x, y:C.y, n:C.n, s:C.s};
let i = 0, shownTurn = 0, workSteps = 0, spoken = 0, paused = false, now = 0, acc = 0;

function reset() {
  i = 0; shownTurn = 0;
  for (const c of CAST) { const v = views.get(c.idx); if (v) { v.warp(cell(c.x, c.y)); v.play('idle', true); } }
  feed('— 구운 걸음이 끝났다. 처음으로 돌아간다 (브라우저는 계산하지 않는다) —');
}

function step(e) {
  const k = e[col.k], a = e[col.a], t = e[col.t], s = e[col.s];
  const V = j => views.get(j);
  switch (k) {
    case K.Turn:  shownTurn = e[col.n]; break;
    case K.Walk:  V(a)?.moveRig(cell(e[col.x], e[col.y]), STEP*0.85); break;
    // 「휘두름」이 일하는 몸짓이다. 밀어붙이지 않는다 — 휘두르는 중이면 그냥 둔다.
    // 전에는 뜰 한가운데를 보고 선 채로 휘둘렀다 — 허공을 두들겼다.
    // 이제 제 연장 쪽으로 돌아선다. 손이 지나는 자리에 그것이 있다.
    case K.Work: {
      workSteps++;
      const v = V(a); if (!v) break;
      const w = stWork.get(s); if (w) v.faceTo(w);
      v.play('attack');
      break;
    }
    case K.Rest:
    case K.Stand: V(a)?.play('idle'); break;                          // 앉는 동작이 없다
    case K.Meet: {
      const x = V(a), y = V(t);
      if (x && y) { x.faceTo(y.pos()); y.faceTo(x.pos()); }
      x?.play('look', true);
      feed(`${nm(a)} ↔ ${nm(t)} — ${s === 'miss' ? '그리워서 다가갔다' : '마주 섰다'}`);
      break;
    }
    case K.Avoid: V(a)?.play('look', true); feed(`${nm(a)} — ${nm(t)}를 피한다`); break;
    case K.Say:   bubble(a, s); break;
    case K.Think: bubble(a, s, 1.6); break;
    case K.Bond:
      if (a < 0) { document.getElementById('sum').textContent = s || ''; }
      else { spoken++; feed(`${nm(a)} ↔ ${nm(t)} — ${s}`); bubble(t, s, 3.2); }
      break;
  }
}

/* 한 걸음을 통째로 재생한다. 다음 Turn 이 나오면 거기서 멈춘다 —
   그 다음 걸음은 다음 박자의 몫이다. (GardenDirector.PlayStep) */
function playStep() {
  if (i >= L.length) { reset(); }
  let guard = 0;
  while (i < L.length && guard < 4096) {
    const e = L[i];
    if (e[col.k] === K.Turn && guard > 0) break;
    i++; guard++;
    step(e);
  }
}

/* ── 단추 ────────────────────────────────────────────────────────── */
const btnPlay = document.getElementById('play'), btnSpeed = document.getElementById('speed');
btnPlay.onclick = () => { paused = !paused; btnPlay.textContent = paused ? '재생' : '멈춤'; };
btnSpeed.onclick = () => {                                    // GardenDirector.CycleSpeed
  STEP = STEP > 0.15 ? STEP/2 : STEP0;
  btnSpeed.textContent = Math.round(STEP0/STEP) + '배';
};
document.getElementById('wide').onclick = e => {
  follow = -1; e.target.classList.add('on');
  [...document.querySelectorAll('#cast .row')].forEach(x => x.classList.remove('on'));
  frameWide();
};
const btnSil = document.getElementById('silh');
btnSil.onclick = () => {
  const on = !btnSil.classList.contains('on');
  btnSil.classList.toggle('on', on);
  for (const g of [cast3, props3]) g.traverse(n => {
    if (n.isMesh && n.userData.sil) n.material = on ? n.userData.sil : n.userData.lit;
  });
};
/* 주소에 ?to=300 을 붙이면 그 걸음까지 건너뛰고 시작하고, ?stop=1 이면 멈춘 채로 뜬다.
   한 장면을 다시 불러오려고 둔 것이다. 이 서버에서 머리 없는 크롬으로 화면을 찍어
   확인할 때도 이것을 쓴다 — 브라우저 창을 열 사람이 없어서 그 방법밖에 없었다. */
{
  const Q = new URLSearchParams(location.search);
  const to = Math.max(0, parseInt(Q.get('to') || '0', 10) || 0);
  for (let k = 0; k < to; k++) playStep();
  if (to) for (const v of views.values()) v.settle();
  if (Q.get('stop') === '1') { paused = true; btnPlay.textContent = '재생'; }
  if (Q.get('sil') === '1') btnSil.click();   // 실루엣으로 뜬다. 유니티 쪽과 견줄 때 쓴다
  const who = Q.get('who');
  if (who) {
    const c = CAST.find(x => x.id === who || String(x.idx) === who);
    if (c) document.querySelector(`#cast .row[data-i="${c.idx}"]`)?.click();
  }
}

/* 말풍선을 닫는다. 유니티에도 없는 단추다 — 여기서만 닫는다.
   처음에는 이 단추가 필요했다. 스물셋이 걸음마다 입을 열어 글자가 뜰을 덮었기 때문이다.
   그건 보여주기의 문제가 아니라 Garden.cs 가 말할 자리를 안 고른 것이었다(그쪽을 고쳤다).
   단추는 남긴다 — 말을 빼고 몸만 보고 싶을 때가 있다. */
const btnTalk = document.getElementById('talk');
let talk = true;
btnTalk.onclick = () => { talk = !talk; btnTalk.classList.toggle('on', talk); };

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); btnPlay.click(); }
  if (e.key === 'b' || e.key === 'ㅠ') btnTalk.click();
  if (e.key === '+' || e.key === '=') btnSpeed.click();
});

/* ── 한 바퀴 ─────────────────────────────────────────────────────── */
function resize() {
  const w = innerWidth, h = innerHeight;
  rend.setSize(w, h, false); cam.aspect = w/h; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
boot.remove();
if (missBody || missProp)
  feed(`<span class="bad">몸 ${missBody}명 · 소품 ${missProp}곳을 못 읽었다.</span>`);

const clock = new THREE.Clock();
const vv = new THREE.Vector3();
/* ── 글자를 화면에 놓는다 ──────────────────────────────────────────
   유니티에는 없는 문제가 하나 있다. 이름표는 사람이 아니라 화면의 물건이라
   기록관에 넷이 모이면 네 이름이 한 자리에 포개져 한 덩어리가 된다(실측:
   기록관 4명 · 우물 3명 · 담 2명 · 채석장 2명이 같은 칸 언저리에 선다).
   그래서 놓기 전에 자리를 잡아 본다 — 겹치면 한 줄씩 올리고, 네 줄을
   올려도 자리가 없으면 가린다. 손잡이(.pane) 밑에 깔리는 것도 가린다.
   가리는 순서는 부르는 순서다: 말풍선 → 가까운 사람 → 먼 사람 → 일터.
   말은 사건이라 절대 가리지 않고, 앞사람에 몸이 가린 사람의 이름을
   지우는 것이 덜 잃는다. */
function screen(p, up) {
  vv.copy(p); vv.y += up; vv.project(cam);
  if (vv.z > 1) return null;
  return { x: (vv.x*0.5 + 0.5)*innerWidth, y: (-vv.y*0.5 + 0.5)*innerHeight, z: vv.z };
}
const hits = (a, b) => a.l < b.r && b.l < a.r && a.t < b.b && b.t < a.b;
let panes = [], taken = [];
function clearPlaces() {
  panes = [...document.querySelectorAll('.pane')].map(el => {
    const r = el.getBoundingClientRect();
    return { l:r.left - 4, r:r.right + 4, t:r.top - 4, b:r.bottom + 4 };
  });
  taken.length = 0;
}
function place(el, s) {
  if (!s) { el.style.display = 'none'; return false; }
  /* 화면 밖으로 새면 글자만 반쯤 걸린다. 가장자리 안쪽에 가둔다. */
  const w = el.offsetWidth || 60, h = el.offsetHeight || 16;
  const x = Math.min(innerWidth - w/2 - 4, Math.max(w/2 + 4, s.x));
  for (let lift = 0; lift < 4; lift++) {
    const y = Math.min(innerHeight - 4, Math.max(h + 4, s.y - lift*(h + 3)));
    const r = { l:x - w/2 - 2, r:x + w/2 + 2, t:y - h - 2, b:y + 2 };
    if (panes.some(q => hits(r, q))) continue;
    if (taken.some(q => hits(r, q))) continue;
    taken.push(r);
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.display = '';
    return true;
  }
  el.style.display = 'none';
  return false;
}
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, clock.getDelta());
  now += dt;

  if (!paused) {
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard++ < 8) { acc -= STEP; playStep(); }
  }
  for (const v of views.values()) v.update(dt);

  /* 카메라 — 한 사람을 따라가면 가까이 붙는다 (GardenDirector.Steer) */
  if (follow >= 0 && views.has(follow)) {
    const p = views.get(follow).pos().clone(); p.y += 0.9;
    ctrl.target.lerp(p, 1 - Math.exp(-dt*2.4));
    const want = ctrl.target.clone().addScaledVector(followFwd(ctrl.target, 9), -9);
    cam.position.lerp(want, 1 - Math.exp(-dt*2.4));
  }
  ctrl.update();

  /* 이름표 · 말풍선 — 자리를 먼저 잡고 한꺼번에 놓는다 */
  clearPlaces();
  const say = [], name = [];
  for (const [idx, el] of tags) {
    const v = views.get(idx);
    const b = bubs.get(idx), hasBub = talk && b && b.until > now;
    if (b && !hasBub) b.el.style.display = 'none';
    if (!v) { el.style.display = 'none'; continue; }
    if (hasBub) {                                  // 말할 때는 이름표 대신 말풍선
      el.style.display = 'none';
      say.push([b.el, screen(v.pos(), 2.0)]);
    } else {
      name.push([el, screen(v.pos(), 1.95)]);
    }
  }
  name.sort((a, c) => (a[1] ? a[1].z : 9) - (c[1] ? c[1].z : 9));   // 가까운 사람부터
  for (const [el, sp] of say)  place(el, sp);
  for (const [el, sp] of name) place(el, sp);
  // 이름표는 구조물 꼭대기 위에 뜬다. 1.1m 에 두면 담과 탑에 파묻힌다.
  NST.forEach((st, j) => place(stags[j], screen(cell(st.x, st.y),
                                (stTops.get(st.name) || 0) + 0.55)));

  document.getElementById('turn').textContent = shownTurn;
  rend.render(sc, cam);
})();
</script>
